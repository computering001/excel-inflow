name: Harden usable broker consumption proof

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - .github/workflows/harden-usable-broker-consumption-proof.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Bind headline assertions to J through L only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/run_usable_broker_workbook_consumption_tests.py')
          text=path.read_text('utf-8')
          old='''def broker_links(sheet, row: int) -> list[str]:\n    links = []\n    for cell in sheet[row]:\n        value = formula(cell.value)\n        if value and "brokers" in value.lower():\n            links.append(value)\n    return links\n'''
          new='''def broker_links(sheet, row: int) -> list[str]:\n    """Return broker formulas only from standalone forecast columns J:L."""\n    links = []\n    for column in range(10, 13):\n        value = formula(sheet.cell(row=row, column=column).value)\n        if value and "brokers" in value.lower():\n            links.append(value)\n    return links\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('broker_links function anchor not found')
              text=text.replace(old,new,1)
          path.write_text(text,'utf-8')
          PY
          python3 -m py_compile scripts/run_usable_broker_workbook_consumption_tests.py
          rm -f .github/workflows/harden-usable-broker-consumption-proof.yml
          git config user.name 'excel-inflow-acceptance-bot'
          git config user.email 'excel-inflow-acceptance-bot@users.noreply.github.com'
          git add -A -- scripts/run_usable_broker_workbook_consumption_tests.py .github/workflows/harden-usable-broker-consumption-proof.yml
          git commit -m 'Bind broker usefulness proof to standalone forecasts'
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
