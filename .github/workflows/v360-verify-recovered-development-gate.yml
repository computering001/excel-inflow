# diagnose the last Stage-4 checkpoint failure on the completed recovered v3.6 target
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdfdea50dce4b228e35e5263ece366e60203a8cc
          fetch-depth: 0
      - name: Install Stage-4 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python3 -m pip install --upgrade pip
          python3 -m pip install pymupdf openpyxl pillow jsonschema lxml numpy
      - name: Reproduce Stage-4 interruption and dump internal state
        shell: bash
        run: |
          set +e
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          export DEBT_OVERLAY_PYTHON="$(command -v python3)"
          export EXCEL_INFLOW_TEST_PYTHON="$(command -v python3)"
          export SOFFICE_BIN="$(command -v soffice)"
          out=/tmp/v360-stage4-diagnostic
          rm -rf "$out"
          node scripts/run_stage4_checkpoint_tests.mjs \
            --cases test-fixtures/cases \
            --python "$(command -v python3)" \
            --soffice "$(command -v soffice)" \
            --out "$out"
          test_exit=$?
          echo "STAGE4_TEST_EXIT=$test_exit"
          echo '--- user-flow result ---'
          find "$out" -name user-flow-result.json -print -exec cat {} \;
          echo '--- build-result ---'
          find "$out" -name build-result.json -print -exec cat {} \;
          echo '--- stage4 filesystem ---'
          find "$out" -path '*/.stage4/*' -maxdepth 12 -type f -printf '%p\n' | sort
          echo '--- receipt contents ---'
          find "$out" -path '*/.stage4/receipts/*.json' -type f -print -exec sh -c 'cat "$1"; echo' _ {} \;
          echo '--- orchestrator logs/receipts outside .stage4 ---'
          find "$out" -type f \( -name '*gate*.json' -o -name '*receipt*.json' -o -name '*result*.json' \) -print | sort
          exit $test_exit
