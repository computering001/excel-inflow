# widen neutral-separator arithmetic proof only where three-period equality remains unique
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-v360-rebuild
          fetch-depth: 0
      - name: Require audited starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd194222bdc2f7106e9e2a8f97c6cde1267a626e4'
      - name: Treat zero non-subtotals as arithmetic-neutral separators at any shallower indent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/extract_filing_statements.py')
          s=p.read_text()
          old='''                    neutral_separator = (\n                        level == parent_level\n                        and not candidate.get("is_subtotal")\n                        and series is not None\n                        and all(abs(value) <= 0.5000001 for value in series)\n                    )\n'''
          new='''                    neutral_separator = (\n                        level <= parent_level\n                        and not candidate.get("is_subtotal")\n                        and series is not None\n                        and all(abs(value) <= 0.5000001 for value in series)\n                    )\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))

          t=Path('scripts/run_source_arithmetic_topology_tests.py')
          q=t.read_text()
          old='''neutral_separator = [\n    row("cf.pbt", "Profit before taxation", [150, 150, 150], 1),\n    row("cf.da", "Depreciation and amortisation", [50, 50, 50], 1),\n    row("cf.neutral", "Net finance result", [0, 0, 0], 0),\n    row("cf.addback", "Net finance costs add-back", [-5, -5, -5], 1),\n    row("cf.wc", "Change in working capital", [0, 0, 0], 1),\n    row("cf.cfo", "Cash generated from operations", [195, 195, 195], 0),\n]\n'''
          new='''neutral_separator = [\n    row("cf.pbt", "Profit before taxation", [150, 150, 150], 3),\n    row("cf.da", "Depreciation and amortisation", [50, 50, 50], 3),\n    row("cf.neutral", "Net finance result", [0, 0, 0], 0),\n    row("cf.addback", "Net finance costs add-back", [-5, -5, -5], 3),\n    row("cf.wc", "Change in working capital", [0, 0, 0], 3),\n    row("cf.cfo", "Cash generated from operations", [195, 195, 195], 2),\n]\n'''
          assert q.count(old)==1, q.count(old)
          t.write_text(q.replace(old,new,1))
          PY
          python3 -m py_compile scripts/extract_filing_statements.py scripts/run_source_arithmetic_topology_tests.py
          python3 scripts/run_source_arithmetic_topology_tests.py
          git diff --check
      - name: Commit proven hierarchy repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-recovery-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/extract_filing_statements.py scripts/run_source_arithmetic_topology_tests.py
          git commit -m 'Recover subtotal arithmetic across neutral indent breaks'
          git push origin HEAD:refs/heads/agent/excel-inflow-v360-rebuild
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
