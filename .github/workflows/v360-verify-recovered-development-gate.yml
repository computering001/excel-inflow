# expose the exact v2 demand graph used by the stale evidence assertion
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ee90b02796719624c119777ef3e81bb4e61d763
      - name: Print demand graph at failing assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_evidence_pipeline_tests.py')
          s=p.read_text()
          needle='        demand = context["model_demand_graph"]\n'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'        print("DEMAND_GRAPH=" + json.dumps(demand, sort_keys=True))\n',1)
          p.write_text(s)
          PY
          python3 scripts/run_evidence_pipeline_tests.py
