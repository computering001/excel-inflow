# trigger exact internal insertion repair
name: v360 repair part15

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-repair-part15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert exact missing 36-byte segment and verify
        shell: bash
        run: |
          set -euo pipefail
          target='publish/v360-recovery-complete/part15.b64'
          test "$(wc -c < "$target")" -eq 7750
          echo 'c2a27fe767a45f25daf0e5ed95eb2d71c272f26ffc0d97051485b38de7b6f0f6  publish/v360-recovery-complete/part15.b64' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          target = Path('publish/v360-recovery-complete/part15.b64')
          data = target.read_text('ascii')
          insert = '0/q6KnM3uLreedcHhFQmOerB1QGGAEPg6gBD'
          assert len(data) == 7750
          assert len(insert) == 36
          data = data[:5478] + insert + data[5478:]
          target.write_text(data, 'ascii')
          PY
          test "$(wc -c < "$target")" -eq 7786
          echo 'dfccdc536caa66c866d5fa0aecdd19ac06346ab2f16d8f78443af4d8c2d4691b  publish/v360-recovery-complete/part15.b64' | sha256sum -c -
      - name: Commit repaired chunk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-recovery-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add publish/v360-recovery-complete/part15.b64
          git commit -m 'Repair complete v3.6 recovery payload tail'
          git push origin HEAD:agent/v360-publication-bridge
