name: Align host proof lint severity

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - .github/workflows/align-host-proof-lint-severity.yml

concurrency:
  group: excel-inflow-converge-repair
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Keep external evidence absence out of source-blocker semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/run_repository_forensic_lint.py')
          text=path.read_text('utf-8')
          old='''            "INSTALLED_HOST_EVIDENCE_CONTRACT_MISSING",\n            "BLOCK",\n            "Release certification has no distinct installed-host/install-receipt evidence boundary.",\n'''
          new='''            "INSTALLED_HOST_EVIDENCE_CONTRACT_MISSING",\n            "WARN",\n            "Release certification has no distinct installed-host/install-receipt evidence boundary; production certification must refuse until one is supplied.",\n'''
          if old in text:
              text=text.replace(old,new,1)
          path.write_text(text,'utf-8')
          PY
          python3 -m py_compile scripts/run_repository_forensic_lint.py
          rm -f .github/workflows/align-host-proof-lint-severity.yml
          git config user.name 'excel-inflow-convergence-bot'
          git config user.email 'excel-inflow-convergence-bot@users.noreply.github.com'
          git add -A -- scripts/run_repository_forensic_lint.py .github/workflows/align-host-proof-lint-severity.yml
          git commit -m 'Separate source acceptance from external host certification'
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
      - name: Re-dispatch convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh workflow view excel-inflow-converge-repair.yml >/dev/null 2>&1; then
            gh workflow run excel-inflow-converge-repair.yml --ref agent/excel-inflow-end-to-end-repair
          fi
