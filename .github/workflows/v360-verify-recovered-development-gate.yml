# isolate the N6 semantic-gate failure before the final Stage-4 checkpoint proof
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdfdea50dce4b228e35e5263ece366e60203a8cc
          fetch-depth: 0
      - name: Build Stage-3 state and print N6 detail
        shell: bash
        run: |
          set -euo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          node scripts/run_evidence_run_tests.mjs test-fixtures/cases --emit-clean /tmp/clean-evidence-run.json
          rm -rf /tmp/n6-run
          node scripts/run_user_flow.mjs /tmp/clean-evidence-run.json --out /tmp/n6-run --stop-after decisions --json > /tmp/paused.json
          cat /tmp/paused.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { runReleaseN0N9 } from './scripts/lib/release_nodes.mjs';
          const evidence=JSON.parse(fs.readFileSync('/tmp/clean-evidence-run.json','utf8'));
          const modelCase=JSON.parse(fs.readFileSync('/tmp/n6-run/stages/decisions/model-case.json','utf8'));
          const candidates={
            dcsExport: evidence.dcs_export ?? evidence.export ?? evidence.dcs ?? null,
            brokerPack: evidence.broker_pack ?? evidence.broker ?? null,
            filings: evidence.filings ?? null,
          };
          console.log('EVIDENCE_KEYS='+Object.keys(evidence).join(','));
          console.log('CASE_SOURCE_COVERAGE='+JSON.stringify(modelCase.source_coverage ?? null));
          console.log('CASE_ANSWERS='+JSON.stringify(modelCase.answers ?? modelCase.stage_three_answers ?? null));
          const result=runReleaseN0N9({modelCase,...candidates});
          console.log('RELEASE_STATUS='+result.status);
          const n6=result.gates.find(g=>g.id==='N6');
          console.log('N6='+JSON.stringify(n6,null,2));
          NODE
