# diagnose the broker page-image validator failure on the exact repaired v3.6 target
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact repaired v3.6 target
        uses: actions/checkout@v4
        with:
          ref: 8f92ec0c978c0a141b86046dfc702a99170a9087
          fetch-depth: 0
      - name: Install Python validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install openpyxl pillow jsonschema lxml pymupdf numpy
      - name: Run broker page evidence and expose validator report
        shell: bash
        run: |
          set +e
          node scripts/run_broker_page_evidence_tests.mjs test-fixtures/cases/standard-maximal-v2.json
          test_exit=$?
          echo "TEST_EXIT=$test_exit"
          echo 'VALIDATION REPORTS:'
          find /tmp -path '*/broker-page-evidence-*/validator/validation-report.json' -print -exec cat {} \;
          exit $test_exit
