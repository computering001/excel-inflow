# prove the sole remaining Stage-4 checkpoint seam in the same portable runtime as the full gate
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf39afb5e513431f87b02d85488fe93b0a10b5e1
          fetch-depth: 0
      - name: Install exact portable gate runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python3 -m pip install --upgrade pip
          python3 -m pip install pymupdf openpyxl pillow jsonschema lxml numpy
          command -v python3
          command -v soffice
          python3 - <<'PY'
          import fitz, openpyxl
          from scripts.render.textfit import load_font_set
          print('PYMUPDF='+fitz.__doc__.splitlines()[0])
          print('OPENPYXL='+openpyxl.__version__)
          print('FONT_SET='+repr(load_font_set()))
          PY
      - name: Run sole previously failing Stage-4 checkpoint test
        shell: bash
        run: |
          set -euo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          export DEBT_OVERLAY_PYTHON="$(command -v python3)"
          export EXCEL_INFLOW_TEST_PYTHON="$(command -v python3)"
          export SOFFICE_BIN="$(command -v soffice)"
          rm -rf /tmp/v360-stage4-proof
          node scripts/run_stage4_checkpoint_tests.mjs \
            --cases test-fixtures/cases \
            --python "$(command -v python3)" \
            --soffice "$(command -v soffice)" \
            --out /tmp/v360-stage4-proof
          cat /tmp/v360-stage4-proof/stage4-checkpoint-test-report.json
          echo 'STAGE4_CONTENT_ADDRESSED_RESUME=PASS'
