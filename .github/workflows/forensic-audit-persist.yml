name: Persist Excel Inflow forensic audit

on:
  pull_request:
    branches:
      - agent/excel-inflow-execution-base

permissions:
  contents: write

jobs:
  audit-and-persist:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Stop when this exact head is already audited
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/baseline
          current=$(git rev-parse HEAD)
          if test -f audit/baseline/audited-head.txt && grep -qx "$current" audit/baseline/audited-head.txt; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install audit runtime
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc poppler-utils jq
          python3 -m pip install --disable-pip-version-check --no-cache-dir PyMuPDF openpyxl pypdf
          echo "SOFFICE=$(command -v soffice)" >> "$GITHUB_ENV"

      - name: Run immutable baseline audit
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit/baseline/*
          python3 scripts/forensic_audit.py --out audit/baseline
          git rev-parse HEAD > audit/baseline/audited-head.txt
          jq '.summary' audit/baseline/forensic-audit.json

      - name: Persist audit evidence on repair branch
        if: steps.guard.outputs.already != 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-forensic-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audit/baseline
          git commit -m 'Record immutable baseline forensic audit [skip ci]'
          git push origin "HEAD:${HEAD_REF}"
