# repair the audited broker-selection forecast-ledger reseal seam on recovered v3.6
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-v360-rebuild
          fetch-depth: 0
      - name: Require audited starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fdfdea50dce4b228e35e5263ece366e60203a8cc'
      - name: Reseal forecast authority after canonical broker selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/lib/broker_preview.mjs')
          s=p.read_text()
          import_marker='import { hashFile, hashValue } from "./run_store.mjs";\n'
          assert s.count(import_marker)==1
          s=s.replace(import_marker,import_marker+'import { sealForecastAuthorityLedger } from "./forecast_authority_ledger.mjs";\n',1)
          old='''  modelCase.stage_three_answers = {\n    ...(modelCase.stage_three_answers ?? {}),\n    "broker.primary_house": verified.selection.house_id,\n    "broker.preview_sha256": preview.preview_sha256,\n  };\n  return modelCase;\n}\n'''
          new='''  modelCase.stage_three_answers = {\n    ...(modelCase.stage_three_answers ?? {}),\n    "broker.primary_house": verified.selection.house_id,\n    "broker.preview_sha256": preview.preview_sha256,\n  };\n  // Broker confirmation is a canonical forecast-authority transition. In\n  // forecast-waterfall mode it deliberately removes broker writers and\n  // reactivates the row-owned formula/historical fallback. Any existing\n  // forecast-authority ledger therefore belongs to the pre-selection graph\n  // and must be resealed here, at the mutator that changed that graph.\n  // Downstream solvers remain fail-closed: any later unreceipted mutation still\n  // causes verifyForecastAuthorityLedger() to reject the case.\n  if (modelCase.forecast_authority_ledger) {\n    sealForecastAuthorityLedger(modelCase);\n  }\n  return modelCase;\n}\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/lib/broker_preview.mjs
          git diff --check
      - name: Commit ledger transition repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-recovery-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/lib/broker_preview.mjs
          git commit -m 'Reseal forecast authority after broker selection'
          git push origin HEAD:refs/heads/agent/excel-inflow-v360-rebuild
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
