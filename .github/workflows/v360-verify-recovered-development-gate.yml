# focused proof of final recovered v3.6 repairs before the full source-owned gate
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repaired v3.6 target
        uses: actions/checkout@v4
        with:
          ref: e0530e55cd74191b952b88f1ff17a08c73345cec
          fetch-depth: 0
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python3 -m pip install --upgrade pip
          python3 -m pip install pymupdf openpyxl pillow jsonschema lxml numpy
      - name: Run focused recovered seams
        shell: bash
        run: |
          set -euo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          export DEBT_OVERLAY_PYTHON="$(command -v python3)"
          export EXCEL_INFLOW_TEST_PYTHON="$(command -v python3)"
          export SOFFICE_BIN="$(command -v soffice)"
          node scripts/run_test_registry_contract_tests.mjs
          python3 scripts/run_evidence_pipeline_tests.py
          node scripts/run_broker_page_evidence_tests.mjs test-fixtures/cases/standard-maximal-v2.json
          node scripts/run_decision_round_tests.mjs
          node scripts/run_filings_pipeline_tests.mjs
          node scripts/run_user_flow_tests.mjs
          echo 'FOCUSED_V360_REPAIR_SEAMS=PASS'
