# P7.7 — the SCHEDULED half of a layered gate.
#
# The pull-request gate (read-only-development-gate.yml) is the fast tier and
# its content is frozen. This file holds the tiers that must actually RUN on a
# clock rather than exist as an intention: the declared nightly and weekly case
# volumes, and the 32-recipe frozen cohort that was CI-dark.
#
# Which tier a run is, and which jobs belong to it, is DECLARED in
# assets/ci-gate-tiers-v1.json. Every cron below and every `if:` condition
# below is pinned against that register by scripts/run_ci_gate_tier_tests.mjs
# and scripts/run_ci_governance_tests.mjs, so a tier cannot quietly stop
# running and a job cannot quietly skip itself.
name: Scheduled deep development gate

on:
  schedule:
    # nightly tier
    - cron: "27 3 * * *"
    # weekly tier
    - cron: "41 5 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Which declared deep tier to run
        required: true
        type: choice
        options:
          - nightly
          - weekly

permissions:
  contents: read

jobs:
  nightly-generated-cohort:
    name: Nightly generated cohort — declared 2,500 and 10,000 case volumes
    if: github.event.schedule == '27 3 * * *' || inputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Declare what this tier covers and what it defers
        run: |
          mkdir -p "${{ runner.temp }}/trend"
          node scripts/run_ci_gate_tier_tests.mjs --declare nightly --out "${{ runner.temp }}/trend/nightly-tier-declaration.json"
      - name: Generated cohort at the declared pr volume
        run: node scripts/run_generated_cohort_tests.mjs --tier pr > "${{ runner.temp }}/trend/generated-cohort-volume-2500.json"
      - name: Generated cohort at the declared nightly volume
        run: node scripts/run_generated_cohort_tests.mjs --tier nightly > "${{ runner.temp }}/trend/generated-cohort-volume-10000.json"
      - name: Retain nightly trend record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-gate-trend-nightly
          path: ${{ runner.temp }}/trend/*.json
          if-no-files-found: error
          retention-days: 90

  nightly-frozen-cohort:
    name: Nightly frozen 32-recipe cohort (previously CI-dark)
    if: github.event.schedule == '27 3 * * *' || inputs.tier == 'nightly'
    runs-on: ubuntu-latest
    # 32 cases, each two clean builds plus the Python oracles; the register
    # declares this same 120-minute budget and the two are pinned equal.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - name: Install the frozen-cohort toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Declare what this tier covers and what it defers
        run: |
          mkdir -p "${{ runner.temp }}/frozen"
          node scripts/run_ci_gate_tier_tests.mjs --declare nightly --out "${{ runner.temp }}/frozen/nightly-tier-declaration.json"
      # continue-on-error here exists ONLY so the compiled cohort and the
      # frozen-cohort report survive a failing stage; the verdict step below
      # restores job truthfulness (P0.3).
      - name: Emit the frozen stress manifest and compile the 32 recipes
        continue-on-error: true
        run: |
          node scripts/run_ci_gate_tier_tests.mjs --emit-frozen-manifest "${{ runner.temp }}/frozen/synthetic-stress-manifest.json"
          node scripts/compile_synthetic_cohort.mjs "${{ runner.temp }}/frozen/synthetic-stress-manifest.json" --bases test-fixtures/cases --out "${{ runner.temp }}/frozen/compiled"
      - name: Drive the frozen cohort through the full emit pipeline
        continue-on-error: true
        run: |
          node scripts/run_frozen_cohort.mjs \
            --manifest "${{ runner.temp }}/frozen/synthetic-stress-manifest.json" \
            --index "${{ runner.temp }}/frozen/compiled/cohort-index.json" \
            --authorities test-fixtures/cases \
            --skill . \
            --out "${{ runner.temp }}/frozen/evidence" \
            --concurrency 2 \
            --case-timeout-ms 300000 \
            --python "$(command -v python3)"
      - name: Retain frozen cohort custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-frozen-cohort
          path: ${{ runner.temp }}/frozen/**/*.json
          if-no-files-found: error
          retention-days: 90
      # The frozen-cohort verdict is authoritative unless the tier register
      # declares an unexpired quarantine for this exact job, with an owner. The
      # expiry is enforced by the same script, so the quarantine cannot age
      # silently: once it lapses this job blocks, and the register's own check
      # fails the pull-request gate.
      - name: Frozen cohort verdict is authoritative unless declared quarantined
        run: |
          node scripts/run_ci_gate_tier_tests.mjs \
            --verdict-for-job nightly-frozen-cohort \
            --report "${{ runner.temp }}/frozen/evidence/frozen-cohort-report.json"

  weekly-generated-cohort:
    name: Weekly generated cohort — declared 25,000 case volume
    if: github.event.schedule == '41 5 * * 0' || inputs.tier == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Declare what this tier covers and what it defers
        run: |
          mkdir -p "${{ runner.temp }}/trend"
          node scripts/run_ci_gate_tier_tests.mjs --declare weekly --out "${{ runner.temp }}/trend/weekly-tier-declaration.json"
      - name: Generated cohort at the declared weekly volume
        run: node scripts/run_generated_cohort_tests.mjs --tier weekly > "${{ runner.temp }}/trend/generated-cohort-volume-25000.json"
      - name: Retain weekly trend record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-gate-trend-weekly
          path: ${{ runner.temp }}/trend/*.json
          if-no-files-found: error
          retention-days: 90
