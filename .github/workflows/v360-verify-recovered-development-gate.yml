# prove the repaired forecast-ledger transition through N6 and Stage-4 checkpoint recovery
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf39afb5e513431f87b02d85488fe93b0a10b5e1
          fetch-depth: 0
      - name: Install isolated Stage-4 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice python3-venv
          python3 -m venv /tmp/v360-python
          /tmp/v360-python/bin/python -m pip install --upgrade pip
          /tmp/v360-python/bin/python -m pip install pymupdf openpyxl pillow jsonschema lxml numpy
      - name: Prove N6 forecast ledger is sealed to current authority graph
        shell: bash
        run: |
          set -euo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          node scripts/run_evidence_run_tests.mjs test-fixtures/cases --emit-clean /tmp/clean-evidence-run.json
          rm -rf /tmp/n6-run
          node scripts/run_user_flow.mjs /tmp/clean-evidence-run.json --out /tmp/n6-run --stop-after decisions --json >/tmp/paused.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { verifyForecastAuthorityLedger } from './scripts/lib/forecast_authority_ledger.mjs';
          import { runReleaseN0N9 } from './scripts/lib/release_nodes.mjs';
          const evidence=JSON.parse(fs.readFileSync('/tmp/clean-evidence-run.json','utf8'));
          const modelCase=JSON.parse(fs.readFileSync('/tmp/n6-run/stages/decisions/model-case.json','utf8'));
          const verified=verifyForecastAuthorityLedger(modelCase);
          if(!verified.valid) throw new Error(verified.errors.join('; '));
          console.log('LEDGER_SHA='+verified.ledger.ledger_sha256);
          const result=runReleaseN0N9({modelCase,dcsExport:evidence.dcs_export??evidence.export??evidence.dcs??null,brokerPack:evidence.broker_pack??evidence.broker??null,filings:evidence.filings??null});
          const n6=result.gates.find(g=>g.id==='N6');
          console.log('N6='+JSON.stringify(n6));
          if(n6?.status!=='PASS') throw new Error('N6 did not pass');
          NODE
      - name: Prove Stage-4 interruption, resume and checkpoint invalidation
        shell: bash
        run: |
          set -euo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          export DEBT_OVERLAY_PYTHON="/tmp/v360-python/bin/python"
          export EXCEL_INFLOW_TEST_PYTHON="/tmp/v360-python/bin/python"
          export SOFFICE_BIN="$(command -v soffice)"
          rm -rf /tmp/v360-stage4-proof
          node scripts/run_stage4_checkpoint_tests.mjs \
            --cases test-fixtures/cases \
            --python /tmp/v360-python/bin/python \
            --soffice "$(command -v soffice)" \
            --out /tmp/v360-stage4-proof
          cat /tmp/v360-stage4-proof/stage4-checkpoint-test-report.json
