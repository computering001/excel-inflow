name: Fix forensic lint self reference

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - .github/workflows/fix-forensic-lint-self-reference.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Exclude the detector source from literal leakage checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/run_repository_forensic_lint.py')
          text=path.read_text('utf-8')
          old='''    for path, body in bodies.items():\n        relative = rel(path)\n        for pattern in PRIVATE_PATTERNS:\n'''
          new='''    for path, body in bodies.items():\n        if path.resolve() == Path(__file__).resolve():\n            continue\n        relative = rel(path)\n        for pattern in PRIVATE_PATTERNS:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected forensic-lint loop not found')
              text=text.replace(old,new,1)
              path.write_text(text,'utf-8')
          PY
          rm -f .github/workflows/fix-forensic-lint-self-reference.yml
          git config user.name 'excel-inflow-acceptance-bot'
          git config user.email 'excel-inflow-acceptance-bot@users.noreply.github.com'
          git add -A -- scripts/run_repository_forensic_lint.py .github/workflows/fix-forensic-lint-self-reference.yml
          git commit -m 'Make forensic lint non-self-referential'
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
