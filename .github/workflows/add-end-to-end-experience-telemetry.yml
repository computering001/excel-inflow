name: Add end to end experience telemetry

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - .github/workflows/add-end-to-end-experience-telemetry.yml

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Add trace root, propagation and independent tests
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/lib/experience_trace.mjs <<'EOF'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          export const EXPERIENCE_TRACE_SCHEMA = "excel-inflow-experience-trace/1.0";

          function canonical(value) {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          }

          function sha256(value) {
            return crypto.createHash("sha256").update(JSON.stringify(canonical(value))).digest("hex");
          }

          function now() {
            return new Date().toISOString();
          }

          function atomicWrite(target, value) {
            fs.mkdirSync(path.dirname(target), { recursive: true });
            const temporary = `${target}.${process.pid}.${crypto.randomUUID()}.tmp`;
            fs.writeFileSync(temporary, `${JSON.stringify(value, null, 2)}\n`, "utf8");
            fs.renameSync(temporary, target);
          }

          function targetPath(traceId, explicitPath = null) {
            if (explicitPath) return path.resolve(explicitPath);
            if (process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_PATH) {
              return path.resolve(process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_PATH);
            }
            const root = process.env.EXCEL_INFLOW_RUN_ROOT
              ? path.resolve(process.env.EXCEL_INFLOW_RUN_ROOT)
              : os.tmpdir();
            return path.join(root, `excel-inflow-experience-${traceId}.json`);
          }

          export function beginExperienceTrace({
            runId = process.env.EXCEL_INFLOW_RUN_ID ?? null,
            component = "public_controller",
            outputPath = null,
          } = {}) {
            const traceId = process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_ID || crypto.randomUUID();
            const rootSpanId = crypto.randomUUID();
            const output = targetPath(traceId, outputPath);
            const startedAt = now();
            const spans = [{
              span_id: rootSpanId,
              parent_span_id: null,
              component,
              phase: "user_submission_to_visible_response",
              started_at: startedAt,
              completed_at: null,
              outcome: "OPEN",
              retry_count: 0,
              reused: false,
              wait_reason: null,
              attributes: {},
            }];
            let finalized = false;
            const trace = {
              schema_version: EXPERIENCE_TRACE_SCHEMA,
              trace_id: traceId,
              run_id: runId,
              root_span_id: rootSpanId,
              created_at: startedAt,
              completed_at: null,
              visible_response_at: null,
              status: "OPEN",
              spans,
              trace_sha256: null,
            };

            process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_ID = traceId;
            process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_PATH = output;
            process.env.EXCEL_INFLOW_EXPERIENCE_ROOT_SPAN_ID = rootSpanId;

            const persist = () => {
              const unsigned = { ...trace, trace_sha256: null };
              trace.trace_sha256 = sha256(unsigned);
              atomicWrite(output, trace);
            };
            persist();

            const startSpan = ({
              component: childComponent,
              phase,
              parentSpanId = rootSpanId,
              attributes = {},
              retryCount = 0,
              reused = false,
              waitReason = null,
            }) => {
              if (finalized) throw new Error("Cannot start a span after the experience trace is finalized.");
              const span = {
                span_id: crypto.randomUUID(),
                parent_span_id: parentSpanId,
                component: childComponent,
                phase,
                started_at: now(),
                completed_at: null,
                outcome: "OPEN",
                retry_count: Number(retryCount) || 0,
                reused: Boolean(reused),
                wait_reason: waitReason,
                attributes: canonical(attributes),
              };
              spans.push(span);
              persist();
              return span.span_id;
            };

            const endSpan = (spanId, { outcome = "PASS", attributes = {} } = {}) => {
              const span = spans.find((candidate) => candidate.span_id === spanId);
              if (!span) throw new Error(`Unknown experience span ${spanId}.`);
              if (span.completed_at) throw new Error(`Experience span ${spanId} is already closed.`);
              span.completed_at = now();
              span.outcome = outcome;
              span.attributes = canonical({ ...span.attributes, ...attributes });
              persist();
            };

            const markVisibleResponse = ({ status = "COMPLETE", attributes = {} } = {}) => {
              if (!trace.visible_response_at) trace.visible_response_at = now();
              const root = spans[0];
              root.attributes = canonical({ ...root.attributes, visible_status: status, ...attributes });
              persist();
            };

            const finalize = ({ outcome = "PASS", attributes = {} } = {}) => {
              if (finalized) return output;
              finalized = true;
              const root = spans[0];
              if (!root.completed_at) root.completed_at = now();
              root.outcome = outcome;
              root.attributes = canonical({ ...root.attributes, ...attributes });
              trace.completed_at = root.completed_at;
              trace.status = outcome;
              persist();
              return output;
            };

            const failFromError = (error, origin) => finalize({
              outcome: "FAIL",
              attributes: {
                failure_origin: origin,
                error_name: error?.name ?? "Error",
                error_message: String(error?.message ?? error),
              },
            });

            process.once("beforeExit", () => finalize({
              outcome: process.exitCode && process.exitCode !== 0 ? "FAIL" : "PASS",
            }));
            process.once("uncaughtExceptionMonitor", (error, origin) => failFromError(error, origin));
            process.once("unhandledRejection", (reason) => failFromError(
              reason instanceof Error ? reason : new Error(String(reason)),
              "unhandledRejection",
            ));

            return {
              traceId,
              rootSpanId,
              outputPath: output,
              startSpan,
              endSpan,
              markVisibleResponse,
              finalize,
            };
          }

          export default { beginExperienceTrace, EXPERIENCE_TRACE_SCHEMA };
          EOF

          cat > assets/experience-trace-v1.schema.json <<'EOF'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "https://local.invalid/excel-inflow/experience-trace-v1.schema.json",
            "title": "Excel Inflow user-visible experience trace",
            "type": "object",
            "additionalProperties": false,
            "required": [
              "schema_version", "trace_id", "run_id", "root_span_id", "created_at",
              "completed_at", "visible_response_at", "status", "spans", "trace_sha256"
            ],
            "properties": {
              "schema_version": { "const": "excel-inflow-experience-trace/1.0" },
              "trace_id": { "type": "string", "minLength": 1 },
              "run_id": { "type": ["string", "null"] },
              "root_span_id": { "type": "string", "minLength": 1 },
              "created_at": { "type": "string", "format": "date-time" },
              "completed_at": { "type": ["string", "null"], "format": "date-time" },
              "visible_response_at": { "type": ["string", "null"], "format": "date-time" },
              "status": { "enum": ["OPEN", "PASS", "FAIL", "BLOCKED", "DEGRADED"] },
              "spans": {
                "type": "array",
                "minItems": 1,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "span_id", "parent_span_id", "component", "phase", "started_at",
                    "completed_at", "outcome", "retry_count", "reused", "wait_reason",
                    "attributes"
                  ],
                  "properties": {
                    "span_id": { "type": "string", "minLength": 1 },
                    "parent_span_id": { "type": ["string", "null"] },
                    "component": { "type": "string", "minLength": 1 },
                    "phase": { "type": "string", "minLength": 1 },
                    "started_at": { "type": "string", "format": "date-time" },
                    "completed_at": { "type": ["string", "null"], "format": "date-time" },
                    "outcome": { "type": "string", "minLength": 1 },
                    "retry_count": { "type": "integer", "minimum": 0 },
                    "reused": { "type": "boolean" },
                    "wait_reason": { "type": ["string", "null"] },
                    "attributes": { "type": "object" }
                  }
                }
              },
              "trace_sha256": { "type": ["string", "null"], "pattern": "^[a-f0-9]{64}$" }
            }
          }
          EOF

          cat > scripts/run_experience_trace_tests.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { beginExperienceTrace } from "./lib/experience_trace.mjs";

          function canonical(value) {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          }
          function sha(value) {
            return crypto.createHash("sha256").update(JSON.stringify(canonical(value))).digest("hex");
          }

          const root = await fs.mkdtemp(path.join(os.tmpdir(), "excel-inflow-trace-test-"));
          const output = path.join(root, "trace.json");
          delete process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_ID;
          delete process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_PATH;
          const trace = beginExperienceTrace({ runId: "trace_test", outputPath: output });
          const broker = trace.startSpan({ component: "broker", phase: "native_inspection", attributes: { houses: 3 } });
          trace.endSpan(broker, { outcome: "PASS", attributes: { native_clean_houses: 1 } });
          const host = trace.startSpan({ component: "model_host", phase: "semantic_response", waitReason: "external_host" });
          trace.endSpan(host, { outcome: "DEGRADED" });
          trace.markVisibleResponse({ status: "COMPLETE", attributes: { workbook_published: true } });
          trace.finalize({ outcome: "PASS" });
          const value = JSON.parse(await fs.readFile(output, "utf8"));
          assert.equal(value.schema_version, "excel-inflow-experience-trace/1.0");
          assert.equal(value.trace_id, trace.traceId);
          assert.equal(value.run_id, "trace_test");
          assert.equal(value.status, "PASS");
          assert.ok(value.visible_response_at);
          assert.equal(value.spans.length, 3);
          assert.equal(value.spans[0].phase, "user_submission_to_visible_response");
          assert.ok(value.spans.slice(1).every((span) => span.parent_span_id === value.root_span_id));
          assert.ok(value.spans.every((span) => span.completed_at));
          const unsigned = { ...value, trace_sha256: null };
          assert.equal(value.trace_sha256, sha(unsigned));
          const carrierSource = await fs.readFile(new URL("./lib/run_carrier.mjs", import.meta.url), "utf8");
          assert.ok(carrierSource.includes("experience_trace_id"));
          const controllerSource = await fs.readFile(new URL("./run_excel_inflow_vnext.mjs", import.meta.url), "utf8");
          assert.ok(controllerSource.includes("experience_trace"));
          console.log(JSON.stringify({ status: "PASS", checks: 14, trace: output }, null, 2));
          EOF

          python3 - <<'PY'
          import json,re
          from pathlib import Path

          controller=Path('scripts/run_excel_inflow_vnext.mjs')
          text=controller.read_text('utf-8')
          if 'experience_trace.mjs' not in text:
              imports=list(re.finditer(r'^import[\s\S]*?;\n',text,flags=re.M))
              if not imports:
                  raise SystemExit('No import block found in public controller')
              end=max(match.end() for match in imports)
              text=text[:end]+'import { beginExperienceTrace } from "./lib/experience_trace.mjs";\n'+text[end:]
          if 'excelInflowExperienceTrace = beginExperienceTrace' not in text:
              anchors=[
                  'const options = parseArgs(process.argv.slice(2));',
                  'const options = parseArgs(process.argv.slice(2))',
                  'const args = process.argv.slice(2);',
              ]
              anchor=next((item for item in anchors if item in text),None)
              if not anchor:
                  # Fall back immediately after the import block.
                  imports=list(re.finditer(r'^import[\s\S]*?;\n',text,flags=re.M))
                  end=max(match.end() for match in imports)
                  injection='\nconst excelInflowExperienceTrace = beginExperienceTrace({ component: "public_controller" });\n'
                  text=text[:end]+injection+text[end:]
              else:
                  text=text.replace(anchor,'const excelInflowExperienceTrace = beginExperienceTrace({ component: "public_controller" });\n'+anchor,1)
          controller.write_text(text,'utf-8')

          carrier=Path('scripts/lib/run_carrier.mjs')
          body=carrier.read_text('utf-8')
          if 'experience_trace_id:' not in body:
              marker='''    status: String(status ?? "RESUMABLE"),\n'''
              replacement=marker+'''    experience_trace_id: process.env.EXCEL_INFLOW_EXPERIENCE_TRACE_ID ?? null,\n'''
              if marker not in body:
                  raise SystemExit('Run carrier status marker not found')
              body=body.replace(marker,replacement,1)
          carrier.write_text(body,'utf-8')

          registry=Path('assets/development-test-registry.json')
          data=json.loads(registry.read_text('utf-8'))
          tests=data.get('tests') or []
          if not any(row.get('id')=='experience-trace' for row in tests if isinstance(row,dict)):
              tests.append({
                  'id':'experience-trace',
                  'phase':'workflow',
                  'runtime':'node',
                  'script':'run_experience_trace_tests.mjs',
              })
              data['tests']=tests
              registry.write_text(json.dumps(data,indent=2,sort_keys=False)+'\n','utf-8')
          PY

          node --check scripts/lib/experience_trace.mjs
          node --check scripts/run_excel_inflow_vnext.mjs
          node scripts/run_experience_trace_tests.mjs
          rm -f .github/workflows/add-end-to-end-experience-telemetry.yml
          git config user.name 'excel-inflow-acceptance-bot'
          git config user.email 'excel-inflow-acceptance-bot@users.noreply.github.com'
          git add -A -- \
            assets/experience-trace-v1.schema.json \
            assets/development-test-registry.json \
            scripts/lib/experience_trace.mjs \
            scripts/lib/run_carrier.mjs \
            scripts/run_experience_trace_tests.mjs \
            scripts/run_excel_inflow_vnext.mjs \
            .github/workflows/add-end-to-end-experience-telemetry.yml
          git commit -m 'Bind user-visible latency to an end-to-end trace root'
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
