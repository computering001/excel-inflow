# trigger after workflow registration
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact recovered tree
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v360.b64
          for i in $(seq -w 0 15); do tr -d '\n\r\t ' < "publish/v360-recovery-complete/part${i}.b64" >> /tmp/v360.b64; done
          echo 'fa24f76ac907af6d0db50ee0827d9c268d55753800aa5e2248e4d0e3bc99060b  /tmp/v360.b64' | sha256sum -c -
          base64 -d /tmp/v360.b64 | gzip -dc > /tmp/v360.patch
          echo '5b89177b3bbd408493493be3b8fc32b90a375fccbceaacab9b285d49e62b5e0f  /tmp/v360.patch' | sha256sum -c -
          rm -rf /tmp/v360-target
          git worktree add --detach /tmp/v360-target dcf459fdb0db4c54da644c6927a3e268188ffd6b
          git -C /tmp/v360-target apply --check /tmp/v360.patch
          git -C /tmp/v360-target apply /tmp/v360.patch
          git -C /tmp/v360-target add -A
          test "$(git -C /tmp/v360-target write-tree)" = 'e68829fd178907b91a650f9b159d4554539f1068'
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python3 -m pip install --upgrade pip
          python3 -m pip install pymupdf openpyxl pillow jsonschema lxml
      - name: Inspect recovered source-owned registry
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v360-target
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/development-test-registry.json')
          d=json.loads(p.read_text())
          tests=d['tests']
          standalone=[t for t in tests if not t.get('requires')]
          external=[t for t in tests if t.get('requires')]
          print('REGISTRY_TOTAL='+str(len(tests)))
          print('STANDALONE_TOTAL='+str(len(standalone)))
          print('EXTERNAL_TOTAL='+str(len(external)))
          print('EXTERNAL_IDS='+','.join(t['id'] for t in external))
          p.write_text(json.dumps({**d,'tests':standalone},indent=2)+'\n')
          PY
      - name: Run every self-contained recovered development test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v360-target
          node scripts/run_development_gate.mjs \
            --python "$(command -v python3)" \
            --soffice "$(command -v soffice)" \
            --concurrency 1 \
            --timeout-ms 600000 \
            --out /tmp/v360-development-gate
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/v360-development-gate/development-gate-report.json').read_text())
          print('GATE_STATUS='+d['status'])
          print('PASS='+str(d['counts']['PASS']))
          print('FAIL='+str(d['counts']['FAIL']))
          print('BLOCKED='+str(d['counts']['BLOCKED']))
          if d['status']!='PASS':
              for r in d['results']:
                  if r['status']!='PASS':
                      print('FAILED_ID='+r['id'])
                      print((r.get('stderr') or '')[-4000:])
              raise SystemExit(1)
          PY
