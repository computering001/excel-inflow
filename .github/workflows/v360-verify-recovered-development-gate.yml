# inspect duplicate statement row identities behind v3.6 arithmetic validation
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c4791ff0ceb800be18f04cefc90056fd94aeebc
          fetch-depth: 0
      - name: Install Python dependencies
        run: python3 -m pip install openpyxl pillow jsonschema lxml pymupdf numpy
      - name: Generate page workbook and inspect row identities
        shell: bash
        run: |
          set +e
          node scripts/run_broker_page_evidence_tests.mjs test-fixtures/cases/standard-maximal-v2.json
          root="$(find /tmp -maxdepth 1 -type d -name 'broker-page-evidence-*' | head -1)"
          export ROOT_PATH="$root"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from openpyxl import load_workbook
          root=Path(os.environ['ROOT_PATH'])
          rp=json.loads(Path(str(root/'emit/model.xlsx')+'.row-map.json').read_text())
          rows=[r for s in ('income_statement','cash_flow') for r in rp['statement_rows'][s]]
          ids=['capex','acquisitions_net_of_cash','cash_from_investing','cash_from_operations','cash_from_financing','net_change_in_cash']
          wb=load_workbook(root/'emit/model.xlsx',data_only=False); wv=load_workbook(root/'emit/model.xlsx',data_only=True)
          ws=wb['Operating Model']; vs=wv['Operating Model']
          for rid in ids:
              found=[r for r in rows if r.get('row_id')==rid]
              print('ROW_ID',rid,'COUNT',len(found))
              for r in found:
                  addr='T'+str(r['row'])
                  print(' ',addr,'formula=',ws[addr].value,'value=',vs[addr].value,'DEF=',json.dumps(r,sort_keys=True))
          from collections import Counter
          dup=[(k,v) for k,v in Counter(r.get('row_id') for r in rows).items() if v>1]
          print('DUPLICATE_ROW_IDS=',dup)
          wb.close();wv.close()
          PY
          exit 1
