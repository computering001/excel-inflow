name: Final repair transaction preflight

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - audit/trigger-final-preflight.txt

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Correct, lint and retrigger v4 transaction
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin agent/excel-inflow-end-to-end-repair
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/full-audit-repair-orchestrator-v4.yml')
          text=workflow.read_text()
          text=text.replace(
              'select(.databaseId != env.GITHUB_RUN_ID|tonumber)',
              'select(.databaseId != (env.GITHUB_RUN_ID | tonumber))',
          )
          required=[
              'run_repair_stage1_stage_v5.py',
              'run_repair_stage2_stage_v3.py',
              'apply_excel_inflow_acquisition_repair_v3.py',
              'run_portable_end_to_end_cases_v2.py',
              'run_broker_headline_anchor_case_test.py',
              'cleanup_repair_scaffolding_v4.py',
              'write_source_identity_asset.py',
          ]
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Final orchestrator is missing required stages: {missing}')
          workflow.write_text(text)
          marker=Path('audit/trigger-full-repair-v4.txt')
          marker.write_text(
              marker.read_text().rstrip()+
              f'\nFinal preflight run {__import__("os").environ["GITHUB_RUN_ID"]}.\n'
          )
          PY
          rm -f .github/workflows/patch-final-orchestrator-v2.yml
          rm -f audit/trigger-final-preflight.txt
          git config user.name "excel-inflow-repair-bot"
          git config user.email "312638569+computering001@users.noreply.github.com"
          git add -A
          git commit -m "Preflight final repair transaction"
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
