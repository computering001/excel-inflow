# inspect exact recovered gate contract before any target write
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact recovered tree and inspect gate contract
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v360.b64
          for i in $(seq -w 0 15); do tr -d '\n\r\t ' < "publish/v360-recovery-complete/part${i}.b64" >> /tmp/v360.b64; done
          echo 'fa24f76ac907af6d0db50ee0827d9c268d55753800aa5e2248e4d0e3bc99060b  /tmp/v360.b64' | sha256sum -c -
          base64 -d /tmp/v360.b64 | gzip -dc > /tmp/v360.patch
          echo '5b89177b3bbd408493493be3b8fc32b90a375fccbceaacab9b285d49e62b5e0f  /tmp/v360.patch' | sha256sum -c -
          rm -rf /tmp/v360-target
          git worktree add --detach /tmp/v360-target dcf459fdb0db4c54da644c6927a3e268188ffd6b
          git -C /tmp/v360-target apply --check /tmp/v360.patch
          git -C /tmp/v360-target apply /tmp/v360.patch
          git -C /tmp/v360-target add -A
          test "$(git -C /tmp/v360-target write-tree)" = 'e68829fd178907b91a650f9b159d4554539f1068'
          cd /tmp/v360-target
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          registry=json.loads(Path('assets/development-test-registry.json').read_text())
          runner=Path('scripts/run_development_gate.mjs').read_text()
          m=re.search(r'registry\.schema_version\s*!==\s*"([^"]+)"',runner)
          print('RECOVERED_REGISTRY_SCHEMA='+str(registry.get('schema_version')))
          print('RUNNER_EXPECTS_SCHEMA='+(m.group(1) if m else 'UNKNOWN'))
          print('REGISTRY_TOTAL='+str(len(registry.get('tests',[]))))
          print('CHANGED_GATE_FILES:')
          PY
          git diff --name-only dcf459fdb0db4c54da644c6927a3e268188ffd6b -- assets/development-test-registry.json scripts/run_development_gate.mjs scripts | grep -E 'development|gate|registry|source_arithmetic|broker_tier1|native_eligibility|release|preflight|trace|solver|authority|carrier|acquisition|non_recurring' || true
          echo 'RUNNER_SCHEMA_LINES:'
          grep -n 'schema_version' scripts/run_development_gate.mjs | head -20 || true
          echo 'REGISTRY_HEAD:'
          head -30 assets/development-test-registry.json
