# inspect the synthetic cash-flow hierarchy behind the remaining v3.6 controller failure
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d871ca1cad6aa3e586ff3b74204e5bbc71a080a
      - name: Emit and inspect clean cash-flow fixture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_evidence_run_tests.mjs test-fixtures/cases --emit-clean /tmp/clean.json
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/clean.json','utf8'));
          for (const m of d.filings.face_statement_manifests.cash_flow) {
            console.log('MANIFEST',m.source_id,m.statement_order);
            for (const r of m.rows) console.log(JSON.stringify(r));
          }
          console.log('CASE_SOURCE_CASH_FLOW_MAP');
          for (const r of d.case_source.statement_map.cash_flow) console.log(JSON.stringify(r));
          NODE
