name: Read-only phased development gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-gates:
    name: Merge compatibility phase gate (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: static-schema, phases: evidence }
          - { lane: semantic-authority, phases: "graph,forecast" }
          - { lane: broker, phases: real_corpus }
          - { lane: finance-schedule, phases: "economics,economic" }
          - { lane: workbook, phases: cohort }
          - { lane: package, phases: proof }
          - { lane: runtime, phases: "workflow,performance" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install portable runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 -m pip install numpy pymupdf openpyxl pillow jsonschema lxml
      - name: Check canonical instruction generation
        run: |
          node scripts/generate_canonical_instructions.mjs --check
          node scripts/run_governance_evidence_tests.mjs
      - name: CI census — every critical suite registered, every script classified
        run: node scripts/run_ci_census_tests.mjs --python "$(command -v python3)" --soffice "$(command -v soffice)" --out "${{ runner.temp }}/test_registry_census.json"
      - name: Run portable phase lane
        continue-on-error: true
        env:
          GATE_OUT: ${{ runner.temp }}/phase-${{ matrix.lane }}
        run: |
          node scripts/run_development_gate.mjs \
            --profile portable --phase "${{ matrix.phases }}" \
            --cases test-fixtures/cases \
            --representative test-fixtures/cases/standard-maximal-v2.json \
            --python "$(command -v python3)" --soffice "$(command -v soffice)" \
            --out "$GATE_OUT" --concurrency 3
      - name: Retain phase custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.lane }}
          path: ${{ runner.temp }}/phase-${{ matrix.lane }}/**/*.json
          if-no-files-found: error
          retention-days: 30
      # continue-on-error above exists ONLY so artifact custody survives a
      # failing lane; this verdict step restores job truthfulness — a failed
      # lane must present as a failed job, never as green (P0.3).
      - name: Lane verdict is authoritative
        env:
          GATE_OUT: ${{ runner.temp }}/phase-${{ matrix.lane }}
        run: |
          node -e "const r=require(process.env.GATE_OUT+'/development-gate-report.json'); if(r.status!=='PASS'){console.error('Lane report status:',r.status);process.exit(1);} console.log('lane PASS');"

  portable-serial:
    name: Merge compatibility complete portable registry (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install portable runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 -m pip install numpy pymupdf openpyxl pillow jsonschema lxml
      - name: Run complete serial portable registry
        continue-on-error: true
        env:
          GATE_OUT: ${{ runner.temp }}/portable-serial
        run: |
          node scripts/run_development_gate.mjs \
            --profile portable --cases test-fixtures/cases \
            --representative test-fixtures/cases/standard-maximal-v2.json \
            --python "$(command -v python3)" --soffice "$(command -v soffice)" \
            --out "$GATE_OUT" --concurrency 1
      - name: Retain serial custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-serial
          path: ${{ runner.temp }}/portable-serial/**/*.json
          if-no-files-found: error
          retention-days: 30
      # See phase-gates: artifact custody first, then a truthful job verdict.
      - name: Serial lane verdict is authoritative
        env:
          GATE_OUT: ${{ runner.temp }}/portable-serial
        run: |
          node -e "const r=require(process.env.GATE_OUT+'/development-gate-report.json'); if(r.status!=='PASS'){console.error('Serial report status:',r.status);process.exit(1);} console.log('serial PASS');"

  custody-inventory:
    name: Enumerate custody tests (explicit BLOCKED allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Enumerate every custody test
        continue-on-error: true
        env:
          GATE_OUT: ${{ runner.temp }}/custody-inventory
        run: node scripts/run_development_gate.mjs --profile custody --out "$GATE_OUT" --concurrency 1
      - name: Retain custody inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custody-inventory
          path: ${{ runner.temp }}/custody-inventory/**/*.json
          if-no-files-found: error
          retention-days: 30
      # Custody policy mirrors compile_ci_gate_matrix.mjs: every enumerated
      # test must be PASS or an EXPLICIT typed BLOCKED (missing custody named);
      # anything else fails the job here, not only in the aggregate.
      - name: Custody verdict is authoritative
        env:
          GATE_OUT: ${{ runner.temp }}/custody-inventory
        run: |
          node -e "const r=require(process.env.GATE_OUT+'/development-gate-report.json'); const bad=(r.results??[]).filter(x=>!['PASS','BLOCKED'].includes(x.status)); if(bad.length){console.error('Invalid custody statuses:',bad.map(x=>x.id+':'+x.status).join(', '));process.exit(1);} console.log('custody inventory PASS_OR_EXPLICIT_BLOCKED');"

  merge-compatibility-identity:
    name: Distinguish merge compatibility from package source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Record the compatibility checkout role
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EXPECTED_ROLE: ${{ github.event_name == 'pull_request' && 'merge_test' || 'candidate_source' }}
        run: |
          node scripts/run_merge_compatibility_identity_check.mjs \
            --candidate-source-commit "$CANDIDATE_SOURCE_SHA" \
            --expected-role "$EXPECTED_ROLE" \
            --out "${{ runner.temp }}/merge-compatibility-identity.json"
      - name: Retain merge-compatibility identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-compatibility-identity
          path: ${{ runner.temp }}/merge-compatibility-identity.json
          if-no-files-found: error
          retention-days: 30

  package-source-identity:
    name: Compile and bind current package/source identity
    runs-on: ubuntu-latest
    # The package compile + smoke runs the full registered surface; its wall
    # clock grows with the registry. 35 minutes was hit as a silent
    # "cancelled" conclusion three runs in a row (P0.3 forensics).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install package smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 -m pip install numpy pymupdf openpyxl pillow jsonschema lxml
      - name: Compile package and verify exact source binding
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          MERGE_TEST_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || '' }}
        run: |
          IDENTITY_ARGS=(--expected-source-commit "$CANDIDATE_SOURCE_SHA")
          if [[ -n "$MERGE_TEST_SHA" ]]; then IDENTITY_ARGS+=(--merge-test-commit "$MERGE_TEST_SHA"); fi
          node scripts/run_current_package_source_identity_check.mjs \
            "${IDENTITY_ARGS[@]}" \
            --python "$(command -v python3)" --soffice "$(command -v soffice)" \
            --out "${{ runner.temp }}/current-package-source-identity.json"
      - name: Retain package/source custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-source-identity
          path: ${{ runner.temp }}/current-package-source-identity.json
          if-no-files-found: error
          retention-days: 30

  aggregate-and-compare:
    name: Exact-once matrix and current-SHA serial/parallel comparison
    needs: [phase-gates, portable-serial, custody-inventory, merge-compatibility-identity, package-source-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the programme-control linter proves handover
          # freshness with merge-base --is-ancestor, which a shallow
          # clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*
          path: ${{ runner.temp }}/portable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: custody-inventory
          path: ${{ runner.temp }}/custody
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-source-identity
          path: ${{ runner.temp }}/package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-compatibility-identity
          path: ${{ runner.temp }}/merge
      - name: Aggregate, compare and compile complete matrix
        env:
          REPORT_ROOT: ${{ runner.temp }}/portable
          MATRIX_OUT: ${{ runner.temp }}/matrix
        run: |
          mkdir -p "$MATRIX_OUT"
          mapfile -t PHASE_REPORTS < <(find "$REPORT_ROOT" -path '*/portable-serial' -prune -o -name development-gate-report.json -print | sort)
          REPORT_ARGS=()
          for REPORT in "${PHASE_REPORTS[@]}"; do REPORT_ARGS+=(--report "$REPORT"); done
          node scripts/aggregate_development_gate_reports.mjs --profile portable "${REPORT_ARGS[@]}" --out "$MATRIX_OUT/portable-aggregate.json"
          COMPARE_ARGS=()
          for REPORT in "${PHASE_REPORTS[@]}"; do COMPARE_ARGS+=(--candidate "$REPORT"); done
          node scripts/compare_development_gate_reports.mjs --baseline "$REPORT_ROOT/portable-serial/development-gate-report.json" "${COMPARE_ARGS[@]}" --out "$MATRIX_OUT/serial-parallel-comparison.json"
          node scripts/compile_ci_gate_matrix.mjs \
            --portable-aggregate "$MATRIX_OUT/portable-aggregate.json" \
            --comparison "$MATRIX_OUT/serial-parallel-comparison.json" \
            --custody-report "${{ runner.temp }}/custody/development-gate-report.json" \
            --merge-report "${{ runner.temp }}/merge/merge-compatibility-identity.json" \
            --package-report "${{ runner.temp }}/package/current-package-source-identity.json" \
            --out "$MATRIX_OUT/complete-ci-gate-matrix.json"
      - name: Retain complete gate matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-development-gate-matrix
          path: ${{ runner.temp }}/matrix/*.json
          if-no-files-found: error
          retention-days: 30
