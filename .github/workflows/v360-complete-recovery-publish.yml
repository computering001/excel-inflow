# retry after complete payload upload
name: v360 complete recovery publish

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-complete-recovery-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v360-complete-recovery-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publication bridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact recovery payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v360-recovery.b64
          for i in $(seq -w 0 15); do
            path="publish/v360-recovery-complete/part${i}.b64"
            test -f "$path" || { echo "Missing $path" >&2; exit 1; }
            tr -d '\n\r\t ' < "$path" >> /tmp/v360-recovery.b64
          done
          test "$(wc -c < /tmp/v360-recovery.b64)" -eq 124576
          echo 'fa24f76ac907af6d0db50ee0827d9c268d55753800aa5e2248e4d0e3bc99060b  /tmp/v360-recovery.b64' | sha256sum -c -
          base64 -d /tmp/v360-recovery.b64 > /tmp/v360-recovery.patch.gz
          echo 'cbf0b88d8e92b371dc3f3e088c75d5df809acbfa7870d84a2f0053c33ee2c836  /tmp/v360-recovery.patch.gz' | sha256sum -c -
          gzip -t /tmp/v360-recovery.patch.gz
          gzip -dc /tmp/v360-recovery.patch.gz > /tmp/v360-recovery.patch
          echo '5b89177b3bbd408493493be3b8fc32b90a375fccbceaacab9b285d49e62b5e0f  /tmp/v360-recovery.patch' | sha256sum -c -

      - name: Require untouched v3.5 target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/excel-inflow-v360-rebuild
          actual="$(git rev-parse refs/remotes/origin/agent/excel-inflow-v360-rebuild)"
          expected='ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd'
          test "$actual" = "$expected" || { echo "Target moved: $actual" >&2; exit 1; }

      - name: Materialize recovered v3.6 implementation
        shell: bash
        run: |
          set -euo pipefail
          base='ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd'
          rm -rf /tmp/v360-target
          git worktree add --detach /tmp/v360-target "$base"
          git -C /tmp/v360-target apply --check /tmp/v360-recovery.patch
          git -C /tmp/v360-target apply /tmp/v360-recovery.patch
          git -C /tmp/v360-target diff --check
          git -C /tmp/v360-target diff --name-only > /tmp/v360-changed.txt
          test "$(wc -l < /tmp/v360-changed.txt)" -eq 145 || {
            echo "Expected 145 changed paths" >&2
            cat /tmp/v360-changed.txt >&2
            exit 1
          }
          if grep -E '^(\.github/|audit/|scripts/apply_broker_tier1_demand_repair\.py$|scripts/finalize_core_demand_and_development_release\.py$)' /tmp/v360-changed.txt; then
            echo 'Recovery payload contains prohibited publication/bootstrap paths.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          failures=[]
          for p in Path('/tmp/v360-target').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              try:
                  json.loads(p.read_text('utf-8'))
              except Exception as exc:
                  failures.append(f'{p}: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('JSON syntax PASS')
          PY

      - name: Commit and publish recovered implementation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/v360-target config user.name 'excel-inflow-recovery-publisher'
          git -C /tmp/v360-target config user.email 'actions@users.noreply.github.com'
          git -C /tmp/v360-target add -A
          git -C /tmp/v360-target diff --cached --check
          git -C /tmp/v360-target commit -m 'Recover v3.6 implementation checkpoint'
          commit="$(git -C /tmp/v360-target rev-parse HEAD)"
          tree="$(git -C /tmp/v360-target rev-parse 'HEAD^{tree}')"
          echo "RECOVERED_COMMIT=$commit"
          echo "RECOVERED_TREE=$tree"
          git -C /tmp/v360-target push origin HEAD:refs/heads/agent/excel-inflow-v360-rebuild

      - name: Verify published branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/excel-inflow-v360-rebuild
          published="$(git rev-parse refs/remotes/origin/agent/excel-inflow-v360-rebuild)"
          test "$published" != 'ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd'
          echo "PUBLISHED_COMMIT=$published"
