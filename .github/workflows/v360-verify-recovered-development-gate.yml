# repair the audited selected-authority materialization ledger seam on recovered v3.6
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-v360-rebuild
          fetch-depth: 0
      - name: Require exact audited target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bf39afb5e513431f87b02d85488fe93b0a10b5e1'
      - name: Seal authority ledger at selected-contract materializer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/lib/forecast_candidate_compiler.mjs')
          s=p.read_text()
          marker='''import { observationsForConcept } from "./forecast_observation.mjs";\n'''
          addition='''import { sealForecastAuthorityLedger } from "./forecast_authority_ledger.mjs";\n'''
          assert s.count(marker)==1, s.count(marker)
          assert addition not in s
          s=s.replace(marker, marker+addition, 1)
          old='''  return materializeForecastPlan(modelCase, sealedPlan);\n}\n\nexport function validateForecastPlanCaseParity'''
          new='''  const materialized = materializeForecastPlan(modelCase, sealedPlan);\n  // This function is the sole selected-authority economic writer. The sealed\n  // contract replaces provisional row authorities, so the forecast-authority\n  // ledger must be resealed here, at the mutator, before the case can cross\n  // into question planning or the solver. Later unreceipted mutations remain\n  // fail-closed because verification rebuilds the ledger from the live case.\n  sealForecastAuthorityLedger(materialized);\n  return materialized;\n}\n\nexport function validateForecastPlanCaseParity'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/lib/forecast_candidate_compiler.mjs
          git diff --check
          node scripts/run_forecast_authority_ledger_tests.mjs
          node scripts/run_forecast_topology_tests.mjs
          node scripts/run_user_flow_tests.mjs test-fixtures/cases
      - name: Commit audited ledger ownership repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-recovery-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/lib/forecast_candidate_compiler.mjs
          git commit -m 'Seal ledger after selected authority materialization'
          git push origin HEAD:refs/heads/agent/excel-inflow-v360-rebuild
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
