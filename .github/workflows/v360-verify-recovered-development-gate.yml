# isolate forecast-authority ledger drift at the decisions -> Stage-4 handoff
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf39afb5e513431f87b02d85488fe93b0a10b5e1
          fetch-depth: 0
      - name: Compare sealed and current authority ledgers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v360-ledger
          mkdir -p /tmp/v360-ledger
          node scripts/run_evidence_run_tests.mjs test-fixtures/cases --emit-clean /tmp/v360-ledger/clean-evidence-run.json
          node scripts/run_user_flow.mjs /tmp/v360-ledger/clean-evidence-run.json \
            --out /tmp/v360-ledger/run --stop-after decisions --json > /tmp/v360-ledger/paused.json
          case_path=/tmp/v360-ledger/run/stages/decisions/model-case.json
          CASE_PATH="$case_path" node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { buildForecastAuthorityLedger } from './scripts/lib/forecast_authority_ledger.mjs';
          const modelCase=JSON.parse(fs.readFileSync(process.env.CASE_PATH,'utf8'));
          const actual=modelCase.forecast_authority_ledger;
          const expected=buildForecastAuthorityLedger(modelCase);
          console.log('ACTUAL_SHA='+actual?.ledger_sha256);
          console.log('EXPECTED_SHA='+expected.ledger_sha256);
          console.log('STAGE_THREE_ANSWERS='+JSON.stringify(modelCase.stage_three_answers??{}));
          console.log('ANSWERS='+JSON.stringify(modelCase.answers??{}));
          console.log('BROKER_CASE='+JSON.stringify(modelCase.controls?.broker_case));
          const key=(r)=>`${r.section}|${r.row_id}|${r.period_end}`;
          const a=new Map((actual?.rows??[]).map(r=>[key(r),r]));
          const e=new Map(expected.rows.map(r=>[key(r),r]));
          const keys=[...new Set([...a.keys(),...e.keys()])].sort();
          let n=0;
          for(const k of keys){
            const ar=a.get(k), er=e.get(k);
            if(JSON.stringify(ar)!==JSON.stringify(er)){
              n++;
              console.log('LEDGER_DIFF='+JSON.stringify({key:k,actual:ar??null,expected:er??null}));
            }
          }
          console.log('LEDGER_DIFF_COUNT='+n);
          JS
