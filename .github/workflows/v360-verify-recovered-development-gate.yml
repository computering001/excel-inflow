# inspect acquisition overlay cells behind v3.6 formula/cache divergence
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c4791ff0ceb800be18f04cefc90056fd94aeebc
          fetch-depth: 0
      - run: python3 -m pip install openpyxl pillow jsonschema lxml pymupdf numpy
      - name: Inspect acquisition overlay cells
        shell: bash
        run: |
          set +e
          node scripts/run_broker_page_evidence_tests.mjs test-fixtures/cases/standard-maximal-v2.json
          root="$(find /tmp -maxdepth 1 -type d -name 'broker-page-evidence-*' | head -1)"
          export ROOT_PATH="$root"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from openpyxl import load_workbook
          root=Path(os.environ['ROOT_PATH']); p=root/'emit/model.xlsx'
          f=load_workbook(p,data_only=False); v=load_workbook(p,data_only=True)
          ws=f['Operating Model']; vs=v['Operating Model']
          for row in range(48,63):
              label=ws[f'B{row}'].value
              vals=[]
              for col in ['J','K','L','N','O','P','S','T','U']:
                  vals.append(f"{col}{row}:F={ws[f'{col}{row}'].value!r}:V={vs[f'{col}{row}'].value!r}")
              print('ROW',row,'LABEL',label,' | '.join(vals))
          print('TRANSACTION CONTROLS')
          for row in range(1,15):
              print(row,ws[f'P{row}'].value,vs[f'P{row}'].value)
          f.close();v.close()
          PY
          exit 1
