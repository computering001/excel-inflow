name: Add policy ownership audit

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - .github/workflows/add-policy-ownership-audit.yml

concurrency:
  group: excel-inflow-converge-repair
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Add explicit duplicate-owner findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/run_repository_forensic_lint.py')
          text=path.read_text('utf-8')
          anchor='''    # Maintainability register: visible, but not allowed to masquerade as correctness.\n'''
          insert='''    # Policy ownership register.  Compatibility views are legitimate only when\n    # they declare the canonical owner that generated or delegated them.\n    product_policy = ROOT / "assets" / "product-constitution-v1.json"\n    delivery_policy = ROOT / "assets" / "delivery-constitution-v1.json"\n    workflow_policy = ROOT / "assets" / "workflow-state-contract-v1.json"\n    policy_values = {}\n    for policy_path in (product_policy, delivery_policy, workflow_policy):\n        if policy_path.is_file():\n            try:\n                policy_values[policy_path] = load_json(policy_path)\n            except Exception:\n                pass\n    if product_policy in policy_values and delivery_policy in policy_values:\n        delivery_value = policy_values[delivery_policy]\n        delegated = any(key in delivery_value for key in (\n            "generated_from", "canonical_owner", "source_constitution_sha256"\n        ))\n        if not delegated:\n            findings.append(finding(\n                "DUPLICATE_PRODUCT_DELIVERY_POLICY_OWNER",\n                "WARN",\n                "Product and delivery constitutions are both manually authored policy owners.",\n                paths=[rel(product_policy), rel(delivery_policy)],\n            ))\n    if workflow_policy in policy_values and product_policy in policy_values:\n        workflow_value = policy_values[workflow_policy]\n        delegated = any(key in workflow_value for key in (\n            "generated_from", "canonical_owner", "source_constitution_sha256"\n        ))\n        if not delegated and any(key in workflow_value for key in (\n            "delivery_blocker_constitution", "vnext_quality_modes", "visible_journey"\n        )):\n            findings.append(finding(\n                "WORKFLOW_STATE_OWNS_PRODUCT_POLICY",\n                "WARN",\n                "Workflow-state metadata still owns delivery or quality policy rather than projecting it.",\n                path=rel(workflow_policy),\n            ))\n    taxonomy_path = ROOT / "assets" / "statement-semantic-taxonomy.v1.json"\n    if taxonomy_path.is_file() and registry_role_path is not None:\n        taxonomy_value = load_json(taxonomy_path)\n        if not any(key in taxonomy_value for key in (\n            "generated_from", "canonical_owner", "source_registry_sha256"\n        )):\n            findings.append(finding(\n                "SEMANTIC_TAXONOMY_MANUAL_COMPATIBILITY_VIEW",\n                "WARN",\n                "The legacy statement taxonomy remains manually maintained beside the canonical role registry.",\n                paths=[rel(taxonomy_path), rel(registry_role_path)],\n            ))\n\n'''
          if insert not in text:
              if anchor not in text:
                  raise SystemExit('Maintainability lint anchor not found')
              text=text.replace(anchor,insert+anchor,1)
          path.write_text(text,'utf-8')
          PY
          python3 -m py_compile scripts/run_repository_forensic_lint.py
          rm -f .github/workflows/add-policy-ownership-audit.yml
          git config user.name 'excel-inflow-convergence-bot'
          git config user.email 'excel-inflow-convergence-bot@users.noreply.github.com'
          git add -A -- scripts/run_repository_forensic_lint.py .github/workflows/add-policy-ownership-audit.yml
          git commit -m 'Expose duplicate policy ownership in forensic audit'
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
      - name: Re-dispatch convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh workflow view excel-inflow-converge-repair.yml >/dev/null 2>&1; then
            gh workflow run excel-inflow-converge-repair.yml --ref agent/excel-inflow-end-to-end-repair
          fi
