name: Excel Inflow final forensic repair transaction v4

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - audit/trigger-full-repair-v4.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: excel-inflow-final-repair-transaction
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out latest isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0

      - name: Cancel superseded repair transactions and synchronise
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo computering001/excel-inflow \
            --branch agent/excel-inflow-end-to-end-repair \
            --limit 100 \
            --json databaseId,name,status \
            --jq '.[] | select(.databaseId != env.GITHUB_RUN_ID|tonumber) | select(.status == "in_progress" or .status == "queued") | select(.name | test("forensic repair transaction"; "i")) | .databaseId' \
            | while read -r run_id; do
                test -z "$run_id" || gh run cancel "$run_id" --repo computering001/excel-inflow || true
              done
          git pull --rebase origin agent/excel-inflow-end-to-end-repair
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install complete runtime and proof toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc poppler-utils
          python3 -m pip install --disable-pip-version-check --quiet pymupdf openpyxl pillow
          node --version
          python3 --version
          soffice --version
          gh --version

      - name: Run exact-source audit, dependency-ordered repairs and portable proofs
        id: transaction
        continue-on-error: true
        shell: bash
        env:
          EXCEL_INFLOW_TEST_PYTHON: python3
          EXCEL_INFLOW_SOURCE_COMMIT: ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd
          EXCEL_INFLOW_SOURCE_TREE: 8631c69b2ca960241e78a4719b3d7441d1c727c8
        run: |
          set -euo pipefail
          rm -rf audit/generated/full-repair-v4
          mkdir -p audit/generated/full-repair-v4
          exec > >(tee audit/generated/full-repair-v4/transaction.log) 2>&1

          echo '=== 1. Detached exact-source baseline and complete history ==='
          rm -rf /tmp/excel-inflow-frozen-source-v4
          git worktree add --detach /tmp/excel-inflow-frozen-source-v4 ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd
          mkdir -p /tmp/excel-inflow-frozen-source-v4/audit
          cp audit/product-target-v1.json /tmp/excel-inflow-frozen-source-v4/audit/product-target-v1.json
          cp scripts/run_deep_product_architecture_audit.py /tmp/excel-inflow-frozen-source-v4/scripts/
          cp scripts/run_forensic_repository_audit.py /tmp/excel-inflow-frozen-source-v4/scripts/
          mkdir -p audit/generated/full-repair-v4/frozen-baseline
          (
            cd /tmp/excel-inflow-frozen-source-v4
            python3 scripts/run_deep_product_architecture_audit.py \
              --out "$GITHUB_WORKSPACE/audit/generated/full-repair-v4/frozen-baseline" \
              --timeout 900 \
              --source-commit ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd \
              --source-tree 8631c69b2ca960241e78a4719b3d7441d1c727c8
          )
          python3 scripts/run_history_blame_audit.py \
            --out audit/generated/full-repair-v4/history \
            --source-commit ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd \
            --source-tree 8631c69b2ca960241e78a4719b3d7441d1c727c8

          echo '=== 2. Source arithmetic, all-house native broker eligibility and canonical event roles ==='
          mkdir -p audit/generated/full-repair-v4/stage1
          python3 scripts/run_repair_stage1_stage_v5.py \
            --out audit/generated/full-repair-v4/stage1
          python3 scripts/run_repair_stage1_gate.py \
            --out audit/generated/full-repair-v4/stage1 \
            --timeout 900

          echo '=== 3. Workflow states, source identity, honest canary and nested telemetry ==='
          mkdir -p audit/generated/full-repair-v4/stage2
          python3 scripts/run_repair_stage2_stage_v3.py \
            --out audit/generated/full-repair-v4/stage2
          EXCEL_INFLOW_SOURCE_COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          EXCEL_INFLOW_SOURCE_TREE=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          python3 scripts/run_repair_stage2_gate.py \
            --out audit/generated/full-repair-v4/stage2 \
            --timeout 900

          echo '=== 4. Funded acquisition across solver, workbook and independent proof ==='
          mkdir -p audit/generated/full-repair-v4/acquisition-map
          python3 scripts/run_acquisition_execution_map.py \
            --out audit/generated/full-repair-v4/acquisition-map
          mkdir -p audit/generated/full-repair-v4/acquisition
          python3 scripts/apply_excel_inflow_acquisition_repair_v3.py \
            --out audit/generated/full-repair-v4/acquisition
          python3 scripts/run_acquisition_repair_gate_v2.py \
            --out audit/generated/full-repair-v4/acquisition \
            --timeout 900

          echo '=== 5. Raw-PDF integration registry and deterministic fixture derivation ==='
          cp scripts/discover_portable_canary_fixture_v2.py scripts/discover_portable_canary_fixture.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('assets/development-test-registry.json')
          registry=json.loads(path.read_text())
          ids={item.get('id') for item in registry.get('tests', [])}
          additions=[
              {'id':'raw-filing-arithmetic-integration','phase':'evidence','runtime':'python','script':'run_raw_filing_arithmetic_integration_test.py'},
              {'id':'raw-broker-native-integration','phase':'evidence','runtime':'python','script':'run_raw_broker_native_integration_test.py'},
          ]
          for item in additions:
              if item['id'] not in ids:
                  registry['tests'].append(item)
                  ids.add(item['id'])
          path.write_text(json.dumps(registry,indent=2)+'\n')
          PY

          echo '=== 6. Raw evidence through cases, workbooks, broker links and independent proofs ==='
          mkdir -p audit/generated/full-repair-v4/e2e
          EXCEL_INFLOW_SOURCE_COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          EXCEL_INFLOW_SOURCE_TREE=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          python3 scripts/run_portable_end_to_end_cases_v2.py \
            --out audit/generated/full-repair-v4/e2e \
            --python "$(command -v python3)" \
            --soffice "$(command -v soffice)" \
            --timeout 1800
          python3 scripts/run_broker_headline_anchor_case_test.py \
            audit/generated/full-repair-v4/e2e/portable-end-to-end-cases.json \
            --out audit/generated/full-repair-v4/e2e/broker-headline-anchor.json

          echo '=== 7. Remove repair scaffolding and create clean repaired-source commit ==='
          python3 scripts/cleanup_repair_scaffolding_v4.py
          git config user.name "excel-inflow-repair-bot"
          git config user.email "312638569+computering001@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No repaired-source diff remained after cleanup.' >&2
            exit 1
          fi
          git commit -m "Repair Excel Inflow source"
          repaired_source_commit=$(git rev-parse HEAD)
          repaired_source_tree=$(git rev-parse HEAD^{tree})
          echo "REPAIRED_SOURCE_COMMIT=$repaired_source_commit" >> "$GITHUB_ENV"
          echo "REPAIRED_SOURCE_TREE=$repaired_source_tree" >> "$GITHUB_ENV"

          echo '=== 8. Bind shipped source identity and compile honest development closure ==='
          python3 audit/tools/write_source_identity_asset.py \
            --commit "$repaired_source_commit" \
            --tree "$repaired_source_tree" \
            --branch agent/excel-inflow-end-to-end-repair \
            --mode development
          mkdir -p audit/generated/full-repair-v4/release
          EXCEL_INFLOW_SOURCE_COMMIT="$repaired_source_commit" \
          EXCEL_INFLOW_SOURCE_TREE="$repaired_source_tree" \
          python3 audit/tools/run_development_release_compile.py \
            --out audit/generated/full-repair-v4/release \
            --timeout 1800

          echo '=== 9. Final post-cleanup source, identity and economic sentinels ==='
          python3 -m compileall -q scripts audit/tools
          while IFS= read -r file; do node --check "$file"; done < <(find scripts -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) | sort)
          node scripts/run_test_registry_interface_tests.mjs
          node scripts/run_product_constitution_tests.mjs
          node scripts/run_delivery_constitution_tests.mjs
          node scripts/run_run_constitution_graph_tests.mjs
          node scripts/run_workflow_state_pairing_tests.mjs
          node scripts/run_user_visible_runtime_trace_tests.mjs
          node scripts/run_economic_role_registry_tests.mjs
          python3 scripts/run_raw_filing_arithmetic_integration_test.py
          python3 scripts/run_raw_broker_native_integration_test.py
          node scripts/run_discrete_event_forecast_tests.mjs
          node scripts/run_funded_acquisition_policy_tests.mjs
          python3 scripts/verify/run_funded_acquisition_policy_tests.py
          python3 scripts/run_funded_acquisition_source_tests.py
          EXCEL_INFLOW_SOURCE_COMMIT="$repaired_source_commit" \
          EXCEL_INFLOW_SOURCE_TREE="$repaired_source_tree" \
          node scripts/run_run_carrier_source_identity_tests.mjs
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          source=json.loads(Path('assets/source-identity.json').read_text())
          release=json.loads(Path('release-manifest.json').read_text())
          headline=json.loads(Path('audit/generated/full-repair-v4/e2e/broker-headline-anchor.json').read_text())
          assert source['schema_version']=='excel-inflow-source-identity/1.0'
          assert source['source_commit']==os.environ['REPAIRED_SOURCE_COMMIT']
          assert source['source_tree']==os.environ['REPAIRED_SOURCE_TREE']
          assert source['package_mode']=='development'
          assert release['packageMode']=='development'
          assert (release.get('certification') or {}).get('certifiedClosureSha256') is None
          assert headline['status']=='PASS'
          PY

          echo '=== 10. Final candidate and external promotion-boundary audit ==='
          mkdir -p audit/generated/full-repair-v4/final
          EXCEL_INFLOW_SOURCE_COMMIT="$repaired_source_commit" \
          EXCEL_INFLOW_SOURCE_TREE="$repaired_source_tree" \
          python3 audit/tools/run_final_candidate_audit.py \
            --out audit/generated/full-repair-v4/final \
            --portable-e2e audit/generated/full-repair-v4/e2e/portable-end-to-end-cases.json \
            --stage1 audit/generated/full-repair-v4/stage1/stage1-gate.json \
            --stage2 audit/generated/full-repair-v4/stage2/stage2-gate.json \
            --acquisition audit/generated/full-repair-v4/acquisition/acquisition-gate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          final=json.loads(Path('audit/generated/full-repair-v4/final/final-candidate-audit.json').read_text())
          e2e=json.loads(Path('audit/generated/full-repair-v4/e2e/portable-end-to-end-cases.json').read_text())
          assert final['candidate_status']=='REPOSITORY_CANDIDATE_READY_FOR_HOST_VALIDATION'
          assert final['promotion_recommendation']=='PROMOTE_ONLY_AFTER_NAMED_EXTERNAL_CONDITIONS'
          assert e2e['status']=='PASS'
          assert e2e['installed_host_semantic_seam_exercised'] is False
          PY

      - name: Preserve complete failure evidence without partial source changes
        if: steps.transaction.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp -R audit/generated/full-repair-v4 "/tmp/full-repair-v4-failure-${GITHUB_RUN_ID}"
          git fetch origin agent/excel-inflow-end-to-end-repair
          git reset --hard origin/agent/excel-inflow-end-to-end-repair
          target="audit/generated/full-repair-v4-failure-${GITHUB_RUN_ID}"
          rm -rf "$target"
          mkdir -p audit/generated
          cp -R "/tmp/full-repair-v4-failure-${GITHUB_RUN_ID}" "$target"
          git config user.name "excel-inflow-repair-bot"
          git config user.email "312638569+computering001@users.noreply.github.com"
          git add "$target"
          git commit -m "Record final repair failure ${GITHUB_RUN_ID}"
          git pull --rebase origin agent/excel-inflow-end-to-end-repair
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
          exit 1

      - name: Commit compiled package and final evidence
        if: steps.transaction.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Compile Excel Inflow development candidate"
          git pull --rebase origin agent/excel-inflow-end-to-end-repair
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
          echo "DELIVERY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DELIVERY_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Bind delivered commit to all proof evidence
        if: steps.transaction.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths={
              'source_identity':'assets/source-identity.json',
              'final':'audit/generated/full-repair-v4/final/final-candidate-audit.json',
              'e2e':'audit/generated/full-repair-v4/e2e/portable-end-to-end-cases.json',
              'headline':'audit/generated/full-repair-v4/e2e/broker-headline-anchor.json',
              'release':'release-manifest.json',
          }
          attestation={
              'schema_version':'excel-inflow-repaired-source-attestation/2.0',
              'repaired_source_commit':os.environ['REPAIRED_SOURCE_COMMIT'],
              'repaired_source_tree':os.environ['REPAIRED_SOURCE_TREE'],
              'delivery_commit':os.environ['DELIVERY_COMMIT'],
              'delivery_tree':os.environ['DELIVERY_TREE'],
              'branch':'agent/excel-inflow-end-to-end-repair',
              'base_commit':'ee5ae55cb8a0ce2f2d1d1b71810fc405c11416dd',
              'evidence':{name:{'path':path,'sha256':hashlib.sha256(Path(path).read_bytes()).hexdigest()} for name,path in paths.items()},
              'installed_host_certified':False,
              'promotion_recommendation':'PROMOTE_ONLY_AFTER_NAMED_EXTERNAL_CONDITIONS',
          }
          Path('audit/generated/full-repair-v4/source-attestation.json').write_text(json.dumps(attestation,indent=2,sort_keys=True)+'\n')
          PY
          git add audit/generated/full-repair-v4/source-attestation.json
          git commit -m "Attest repaired source and portable evidence"
          git pull --rebase origin agent/excel-inflow-end-to-end-repair
          git push origin HEAD:agent/excel-inflow-end-to-end-repair

      - name: Create or update draft repair PR
        if: steps.transaction.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## Repair scope

          This PR repairs Excel Inflow from raw evidence through workbook delivery:

          - source-visible issuer arithmetic before label taxonomy;
          - quality-first all-house native broker eligibility and one bounded recovery frontier;
          - complete Tier-1 broker demand and exactly one delivered EBIT/Adjusted EBITDA headline anchor;
          - one canonical structured-event role registry and no automatic recurrence of discrete acquisitions or disposals;
          - funded acquisition consideration, proceeds, cash, debt, interest and leverage mechanics across solver, workbook and independent proof;
          - valid workflow states, shipped source identity, honest canary boundaries and append-only user-visible telemetry;
          - raw-PDF, mutation, case, workbook, cache, finance and semantic proof coverage;
          - consistent development closure with one-off repair scaffolding removed.

          Full evidence is under `audit/generated/full-repair-v4/`.

          The repository candidate is ready for installed-host validation. It remains deliberately uncertified until the named live Rogo usable-broker, native Excel, visual and wall-clock evidence is supplied.
          EOF
          existing=$(gh pr list --repo computering001/excel-inflow --head agent/excel-inflow-end-to-end-repair --json number --jq '.[0].number // empty')
          if test -n "$existing"; then
            gh pr edit "$existing" --repo computering001/excel-inflow \
              --base agent/broker-delivery-constitution-v350 \
              --title "Repair Excel Inflow end to end" \
              --body-file /tmp/pr-body.md
            gh pr ready "$existing" --repo computering001/excel-inflow --undo || true
          else
            gh pr create --repo computering001/excel-inflow --draft \
              --base agent/broker-delivery-constitution-v350 \
              --head agent/excel-inflow-end-to-end-repair \
              --title "Repair Excel Inflow end to end" \
              --body-file /tmp/pr-body.md
          fi

      - name: Upload complete final transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-inflow-full-repair-v4-${{ github.run_id }}
          path: audit/generated/full-repair-v4*
          retention-days: 30
          if-no-files-found: warn
