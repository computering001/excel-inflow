# diagnose the sole remaining Stage-4 semantic checkpoint seam on exact repaired v3.6 target
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf39afb5e513431f87b02d85488fe93b0a10b5e1
          fetch-depth: 0
      - name: Install minimal Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/v360-python
          /tmp/v360-python/bin/python -m pip install --upgrade pip
          /tmp/v360-python/bin/python -m pip install pymupdf openpyxl pillow jsonschema lxml numpy
      - name: Diagnose Stage-4 semantic boundary
        shell: bash
        run: |
          set -uo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          export DEBT_OVERLAY_PYTHON="/tmp/v360-python/bin/python"
          export EXCEL_INFLOW_TEST_PYTHON="/tmp/v360-python/bin/python"
          rm -rf /tmp/v360-debug
          mkdir -p /tmp/v360-debug
          node scripts/run_evidence_run_tests.mjs test-fixtures/cases --emit-clean /tmp/v360-debug/clean-evidence-run.json
          node scripts/run_user_flow.mjs /tmp/v360-debug/clean-evidence-run.json --out /tmp/v360-debug/run --stop-after decisions --json > /tmp/v360-debug/paused.json
          cat > /tmp/v360-debug/slow-soffice <<'SH'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo 'LibreOffice debug shim'
            exit 0
          fi
          sleep 30
          exit 0
          SH
          chmod +x /tmp/v360-debug/slow-soffice
          set +e
          node scripts/run_user_flow.mjs /tmp/v360-debug/clean-evidence-run.json \
            --out /tmp/v360-debug/run \
            --timeout 25000 \
            --python /tmp/v360-python/bin/python \
            --soffice /tmp/v360-debug/slow-soffice \
            --json > /tmp/v360-debug/interrupted.json 2> /tmp/v360-debug/interrupted.stderr
          code=$?
          set -e
          echo "FLOW_EXIT=$code"
          echo '--- interrupted.json ---'
          cat /tmp/v360-debug/interrupted.json || true
          echo '--- interrupted.stderr ---'
          cat /tmp/v360-debug/interrupted.stderr || true
          echo '--- files ---'
          find /tmp/v360-debug/run -maxdepth 5 -type f -print | sort
          echo '--- stage/build JSON ---'
          while IFS= read -r f; do
            echo "### $f"
            cat "$f" || true
          done < <(find /tmp/v360-debug/run -maxdepth 5 -type f \( -name 'build-result.json' -o -name 'run-result.json' -o -name 'semantic_gates.json' -o -name 'stage.json' \) -print | sort)
          exit 0
