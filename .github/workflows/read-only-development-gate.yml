name: Read-only phased development gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-gates:
    name: Phase gate (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: static-schema, phases: evidence }
          - { lane: semantic-authority, phases: "graph,forecast" }
          - { lane: broker, phases: real_corpus }
          - { lane: finance-schedule, phases: "economics,economic" }
          - { lane: workbook, phases: cohort }
          - { lane: package, phases: proof }
          - { lane: runtime, phases: "workflow,performance" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install portable runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 -m pip install numpy pymupdf openpyxl pillow jsonschema lxml
      - name: Check canonical instruction generation
        run: |
          node scripts/generate_canonical_instructions.mjs --check
          node scripts/run_governance_evidence_tests.mjs
      - name: Run portable phase lane
        continue-on-error: true
        env:
          GATE_OUT: ${{ runner.temp }}/phase-${{ matrix.lane }}
        run: |
          node scripts/run_development_gate.mjs \
            --profile portable --phase "${{ matrix.phases }}" \
            --cases test-fixtures/cases \
            --representative test-fixtures/cases/standard-maximal-v2.json \
            --python "$(command -v python3)" --soffice "$(command -v soffice)" \
            --out "$GATE_OUT" --concurrency 3
      - name: Retain phase custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.lane }}
          path: ${{ runner.temp }}/phase-${{ matrix.lane }}/*.json
          if-no-files-found: error
          retention-days: 30

  portable-serial:
    name: Complete portable registry (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install portable runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 -m pip install numpy pymupdf openpyxl pillow jsonschema lxml
      - name: Run complete serial portable registry
        continue-on-error: true
        env:
          GATE_OUT: ${{ runner.temp }}/portable-serial
        run: |
          node scripts/run_development_gate.mjs \
            --profile portable --cases test-fixtures/cases \
            --representative test-fixtures/cases/standard-maximal-v2.json \
            --python "$(command -v python3)" --soffice "$(command -v soffice)" \
            --out "$GATE_OUT" --concurrency 1
      - name: Retain serial custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-serial
          path: ${{ runner.temp }}/portable-serial/*.json
          if-no-files-found: error
          retention-days: 30

  custody-inventory:
    name: Enumerate custody tests (explicit BLOCKED allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Enumerate every custody test
        continue-on-error: true
        env:
          GATE_OUT: ${{ runner.temp }}/custody-inventory
        run: node scripts/run_development_gate.mjs --profile custody --out "$GATE_OUT" --concurrency 1
      - name: Retain custody inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custody-inventory
          path: ${{ runner.temp }}/custody-inventory/*.json
          if-no-files-found: error
          retention-days: 30

  package-source-identity:
    name: Compile and bind current package/source identity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install package smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-calc poppler-utils fonts-crosextra-carlito
          python3 -m pip install numpy pymupdf openpyxl pillow jsonschema lxml
      - name: Compile package and verify exact source binding
        run: |
          node scripts/run_current_package_source_identity_check.mjs \
            --python "$(command -v python3)" --soffice "$(command -v soffice)" \
            --out "${{ runner.temp }}/current-package-source-identity.json"
      - name: Retain package/source custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-source-identity
          path: ${{ runner.temp }}/current-package-source-identity.json
          if-no-files-found: error
          retention-days: 30

  aggregate-and-compare:
    name: Exact-once matrix and current-SHA serial/parallel comparison
    needs: [phase-gates, portable-serial, custody-inventory, package-source-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*
          path: ${{ runner.temp }}/portable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: custody-inventory
          path: ${{ runner.temp }}/custody
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-source-identity
          path: ${{ runner.temp }}/package
      - name: Aggregate, compare and compile complete matrix
        env:
          REPORT_ROOT: ${{ runner.temp }}/portable
          MATRIX_OUT: ${{ runner.temp }}/matrix
        run: |
          mkdir -p "$MATRIX_OUT"
          mapfile -t PHASE_REPORTS < <(find "$REPORT_ROOT" -path '*/portable-serial' -prune -o -name development-gate-report.json -print | sort)
          REPORT_ARGS=()
          for REPORT in "${PHASE_REPORTS[@]}"; do REPORT_ARGS+=(--report "$REPORT"); done
          node scripts/aggregate_development_gate_reports.mjs --profile portable "${REPORT_ARGS[@]}" --out "$MATRIX_OUT/portable-aggregate.json"
          COMPARE_ARGS=()
          for REPORT in "${PHASE_REPORTS[@]}"; do COMPARE_ARGS+=(--candidate "$REPORT"); done
          node scripts/compare_development_gate_reports.mjs --baseline "$REPORT_ROOT/portable-serial/development-gate-report.json" "${COMPARE_ARGS[@]}" --out "$MATRIX_OUT/serial-parallel-comparison.json"
          node scripts/compile_ci_gate_matrix.mjs \
            --portable-aggregate "$MATRIX_OUT/portable-aggregate.json" \
            --comparison "$MATRIX_OUT/serial-parallel-comparison.json" \
            --custody-report "${{ runner.temp }}/custody/development-gate-report.json" \
            --package-report "${{ runner.temp }}/package/current-package-source-identity.json" \
            --out "$MATRIX_OUT/complete-ci-gate-matrix.json"
      - name: Retain complete gate matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-development-gate-matrix
          path: ${{ runner.temp }}/matrix/*.json
          if-no-files-found: error
          retention-days: 30
