# prove the sole remaining Stage-4 checkpoint seam on the repaired v3.6 target
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 912e50d22dd109176f521080d78d71141fc58cb0
          fetch-depth: 0
      - name: Install HOME-independent portable runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y libreoffice python3-venv >/dev/null
          python3 -m venv /tmp/v360-python
          /tmp/v360-python/bin/python -m pip install --upgrade pip >/dev/null
          /tmp/v360-python/bin/python -m pip install pymupdf openpyxl pillow jsonschema lxml numpy >/dev/null
          HOME=/tmp/isolated-home /tmp/v360-python/bin/python -c 'import fitz,openpyxl; print("HOME_INDEPENDENT_PYTHON=PASS",openpyxl.__version__)'
      - name: Run Stage-4 content-addressed resume proof
        shell: bash
        run: |
          set -euo pipefail
          export DEBT_OVERLAY_CASES_DIR="$GITHUB_WORKSPACE/test-fixtures/cases"
          export DEBT_OVERLAY_PYTHON="/tmp/v360-python/bin/python"
          export EXCEL_INFLOW_TEST_PYTHON="/tmp/v360-python/bin/python"
          export SOFFICE_BIN="$(command -v soffice)"
          rm -rf /tmp/v360-stage4-proof
          node scripts/run_stage4_checkpoint_tests.mjs \
            --cases test-fixtures/cases \
            --python /tmp/v360-python/bin/python \
            --soffice "$(command -v soffice)" \
            --out /tmp/v360-stage4-proof
          cat /tmp/v360-stage4-proof/stage4-checkpoint-test-report.json
          echo 'STAGE4_CONTENT_ADDRESSED_RESUME=PASS'
