# inspect the synthetic filing hierarchy behind the remaining v3.6 controller failure
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0530e55cd74191b952b88f1ff17a08c73345cec
      - name: Emit and inspect clean filing fixture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_evidence_run_tests.mjs test-fixtures/cases --emit-clean /tmp/clean.json
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/clean.json','utf8'));
          for (const m of d.filings.face_statement_manifests.income_statement) {
            console.log('MANIFEST',m.source_id,m.statement_order);
            for (const r of m.rows) console.log(JSON.stringify(r));
          }
          console.log('CASE_SOURCE_INCOME_MAP');
          for (const r of d.case_source.statement_map.income_statement) console.log(JSON.stringify(r));
          NODE
