name: Excel Inflow correct trace and final closure

on:
  push:
    branches:
      - agent/excel-inflow-end-to-end-repair
    paths:
      - .github/workflows/excel-inflow-correct-trace-and-final-closure.yml
  workflow_dispatch:

concurrency:
  group: excel-inflow-converge-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correct-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-end-to-end-repair
          fetch-depth: 0
      - name: Start from the settled finalized source
        shell: bash
        run: |
          set -euo pipefail
          sleep 120
          git fetch origin agent/excel-inflow-end-to-end-repair
          git reset --hard origin/agent/excel-inflow-end-to-end-repair
          git clean -fdx
      - name: Make the visible-response marker status-neutral
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          controller=Path('scripts/run_excel_inflow_vnext.mjs')
          text=controller.read_text('utf-8')
          old='excelInflowExperienceTrace.markVisibleResponse({ status: "COMPLETE" });'
          new='excelInflowExperienceTrace.markVisibleResponse({ status: "VISIBLE_RESPONSE" });'
          if old in text:
              text=text.replace(old,new,1)
          if new not in text:
              raise SystemExit('Public visible-response trace marker not found')
          controller.write_text(text,'utf-8')

          test=Path('scripts/run_experience_trace_tests.mjs')
          body=test.read_text('utf-8')
          if 'VISIBLE_RESPONSE' not in body:
              body=body.replace(
                  'assert.ok(controllerSource.includes("markVisibleResponse"));',
                  'assert.ok(controllerSource.includes("markVisibleResponse"));\n          assert.ok(controllerSource.includes("VISIBLE_RESPONSE"));',
                  1,
              )
          test.write_text(body,'utf-8')
          PY
          node --check scripts/run_excel_inflow_vnext.mjs
          node scripts/run_experience_trace_tests.mjs
      - name: Remove all remaining one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            test -e "$workflow" || continue
            case "$(basename "$workflow")" in
              excel-inflow-ci.yml|excel-inflow-final-acceptance-v3.yml|excel-inflow-forensic-lint.yml|excel-inflow-correct-trace-and-final-closure.yml)
                ;;
              *) rm -f "$workflow" ;;
            esac
          done
          rm -f .github/workflows/excel-inflow-correct-trace-and-final-closure.yml
          find scripts -maxdepth 1 -type f \( -name 'apply_excel_inflow_repair_stage*.py' -o -name 'fix_stage*.py' -o -name 'run_repair_stage*_stage_v*.py' \) -delete
      - name: Re-run forensic source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          mkdir -p "$RUNNER_TEMP/forensic"
          python3 scripts/run_repository_forensic_lint.py --out "$RUNNER_TEMP/forensic/report.json"
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ D .github/workflows/' || true)" || true
      - name: Recompile development closure after the last source change
        shell: bash
        run: |
          set -euo pipefail
          if grep -q -- '--package-mode' scripts/compile_skill_release.mjs; then
            node scripts/compile_skill_release.mjs --package-mode development
          elif grep -q -- '--mode' scripts/compile_skill_release.mjs; then
            node scripts/compile_skill_release.mjs --mode development
          else
            node scripts/compile_skill_release.mjs
          fi
          python3 - <<'PY'
          import json,re
          value=json.load(open('release-manifest.json'))
          certification=value.get('certification') or {}
          assert value.get('packageMode') == 'development'
          assert certification.get('certifiedClosureSha256') is None
          assert re.fullmatch(r'[a-f0-9]{64}',str(certification.get('currentClosureSha256') or ''))
          assert int(certification.get('closureFileCount') or 0) > 0
          PY
      - name: Commit the final trace-correct source closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-finalizer'
          git config user.email 'excel-inflow-finalizer@users.noreply.github.com'
          git add -A -- SKILL.md central-instructions.md release-manifest.json assets references scripts .github/workflows
          git commit -m 'Finalize trace-correct Excel Inflow development closure'
          git fetch origin agent/excel-inflow-end-to-end-repair
          git rebase origin/agent/excel-inflow-end-to-end-repair
          git push origin HEAD:agent/excel-inflow-end-to-end-repair
