name: v370 atomic protected cash-flow repair v2

on:
  push:
    branches:
      - agent/excel-inflow-v370-semantic-repair
    paths:
      - .github/workflows/v370-atomic-cashflow-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: v370-atomic-cashflow-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-v370-semantic-repair
          fetch-depth: 0

      - name: Require only v3.7 repair workflows beyond baseline
        shell: bash
        run: |
          set -euo pipefail
          base='456ca1fa5006dc8ecd586b1149f8865b8769ab52'
          unexpected="$(git diff --name-only "$base"..HEAD | grep -v '^\.github/workflows/v370-atomic-cashflow-repair' || true)"
          test -z "$unexpected" || { printf 'Unexpected product change before atomic repair:\n%s\n' "$unexpected" >&2; exit 1; }

      - name: Apply and prove protected cash-flow identities
        shell: bash
        env:
          P1: 
          P2: 
          P3: 
          P4: 
          P5: eHQodGVzdCwgInV0Zi04IikK
        run: |
          set -euo pipefail
          printf '%s%s%s%s%s' "$P1" "$P2" "$P3" "$P4" "$P5" | base64 -d > /tmp/apply_v370_cashflow.py
          python3 /tmp/apply_v370_cashflow.py
          node --check scripts/lib/case_compiler.mjs
          node --check scripts/run_v370_cash_flow_identity_tests.mjs
          node scripts/run_v370_cash_flow_identity_tests.mjs
          node scripts/run_case_compiler_mutation_tests.mjs
          node scripts/run_forecast_topology_tests.mjs
          node scripts/run_nonrecurring_forecast_policy_tests.mjs
          git diff --check

      - name: Commit only the passing atomic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Excel Inflow v3.7 repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/lib/case_compiler.mjs scripts/run_v370_cash_flow_identity_tests.mjs
          git diff --cached --check
          git commit -m 'Protect cash-flow activity identities from forecast carry-forward'
          git push origin HEAD:refs/heads/agent/excel-inflow-v370-semantic-repair
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
