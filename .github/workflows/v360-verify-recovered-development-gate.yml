# correct the audited v2 demand-graph test expectation on the preserved v3.6 target
name: v360 verify recovered development gate

on:
  push:
    branches:
      - agent/v360-publication-bridge
    paths:
      - .github/workflows/v360-verify-recovered-development-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out v3.6 target
        uses: actions/checkout@v4
        with:
          ref: agent/excel-inflow-v360-rebuild
          fetch-depth: 0
      - name: Require audited starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5ee90b02796719624c119777ef3e81bb4e61d763'
      - name: Correct v2 demand graph test expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_evidence_pipeline_tests.py')
          s=p.read_text()
          old='''            demand["schema_version"] == "pre-broker-model-demand/2.0"\n            and demand["counts"] == {\n                "source_rows": 2,\n                "filed_forecast_nodes": 0,\n                "model_demand_concepts": 9,\n                "model_demand_nodes": 27,\n                "material_model_demand_nodes": 27,\n            }\n'''
          new='''            demand["schema_version"] == "pre-broker-model-demand/2.0"\n            and demand["counts"] == {\n                "source_rows": 0,\n                "filed_forecast_nodes": 0,\n                "model_demand_concepts": 9,\n                "model_demand_nodes": 27,\n                "material_model_demand_nodes": 27,\n            }\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          python3 -m py_compile scripts/run_evidence_pipeline_tests.py
          git diff --check
          git diff -- scripts/run_evidence_pipeline_tests.py
      - name: Commit corrected test custody
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'excel-inflow-recovery-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/run_evidence_pipeline_tests.py
          git commit -m 'Correct v2 broker demand test custody'
          git push origin HEAD:refs/heads/agent/excel-inflow-v360-rebuild
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
